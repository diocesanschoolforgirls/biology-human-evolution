<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nastic Responses Quiz</title>
<style>
  :root {
    /* Orange palette, matching the AS91603 Plant and Animal Responses slides */
    --page: #FFF4E0;          /* page background */
    --deep-forest: #FFF9EF;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #FDE6C6;     /* letter circles, dividers */
    --sea-mint: #EA580C;      /* orange accent */
    --bright: #F59E0B;        /* amber */
    --rust: #9A3412;          /* rust text accent */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #6B4E3D;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on orange fills */
    --soft-moss: #9A3412;     /* button hover */
    --heading: #1E293B;       /* headings */
    --good: #2F7D4F;          /* correct */
    --good-tint: #E4F3E9;
    --rose: #B42318;          /* incorrect */
    --rose-tint: #FDECEA;
    --mint-tint: #E4F3E9;
    --option-bg: #FFF8EC;
    --track: #FCE3BE;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91603 · Plant and Animal Responses</div>
    <div class="title-row">
      <h1>Nastic Responses</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Defining nastic responses",
    "q": "Which statement best describes a nastic response?",
    "options": [
      "A growth response of part of a plant towards or away from the direction of a stimulus",
      "A reversible plant movement whose direction does not depend on the direction of the stimulus",
      "A movement of a whole plant away from unfavourable conditions towards better ones"
    ],
    "answer": 1,
    "why": [
      "A growth response whose direction is set by the stimulus is a tropism, not a nastic response.",
      "In a nastic response, part of the plant moves in a fixed way, such as a leaflet folding or a flower closing, whatever direction the stimulus comes from. Most nastic responses are driven by turgor changes, so they are fast and reversible.",
      "Plants are fixed in place and cannot move their whole body. Nastic responses are movements of plant parts, such as leaves, leaflets and flowers."
    ]
  },
  {
    "concept": "Defining nastic responses",
    "q": "Which statement comparing tropisms and nastic responses is most correct?",
    "options": [
      "Nastic responses are growth responses, while tropisms are caused by turgor changes",
      "Tropisms are growth responses, while nastic responses move the whole plant",
      "In a tropism the stimulus direction sets the response direction, but not in a nastic response"
    ],
    "answer": 2,
    "why": [
      "This is reversed, and it is a common exam error. Tropisms are growth responses, while most nastic responses are driven by changes in turgor.",
      "Tropisms are growth responses, so this is partly right. However, nastic responses move parts of a plant, not the whole plant.",
      "The key difference is direction. A shoot bends towards the side light comes from, which is a tropism. A Mimosa leaflet folds the same way wherever it is touched, which is a nastic response."
    ]
  },
  {
    "concept": "Types of nastic response",
    "q": "Oxalis leaflets fold downwards when sunlight becomes very intense, and rise again when the light weakens. This response is",
    "options": [
      "photonasty",
      "nyctinasty",
      "positive phototropism"
    ],
    "answer": 0,
    "why": [
      "The leaflets respond to the intensity of light, folding in strong sunlight whatever direction it comes from. A nastic response to light intensity is photonasty.",
      "Nyctinasty is also linked to light, so this is partly right. However, nyctinasty is a response to the daily cycle of light and darkness, such as leaves folding at night. Here the leaflets fold in strong light during the day.",
      "Phototropism is growth towards the direction of light. The Oxalis leaflets fold away from the light, quickly and reversibly, so this is not a tropism."
    ]
  },
  {
    "concept": "Types of nastic response",
    "q": "Daisies close their flowers at dusk and open them again in the morning, following the daily cycle of day and night. This response is",
    "options": [
      "photonasty",
      "thermonasty",
      "nyctinasty"
    ],
    "answer": 2,
    "why": [
      "Light is involved, so this is partly right. However, photonasty describes a response to light intensity at a particular moment, while this is a response to the daily cycle of light and darkness.",
      "Temperature does drop at dusk, but the closing follows the daily cycle of light and darkness, often kept in time by an internal clock.",
      "Nyctinasty is a nastic response to the daily cycle of light and darkness, often called a sleep movement. The flower closes at dusk and opens in the morning, the same way each day."
    ]
  },
  {
    "concept": "Types of nastic response",
    "q": "When a lit match is held near (but not touching) a Mimosa pudica leaf, its leaflets fold up within seconds. This response is",
    "options": [
      "thigmonasty, because Mimosa is known for responding to touch",
      "thermonasty, because the leaflets are responding to the sudden heat",
      "positive thermotropism, because the leaflets respond to the heat source"
    ],
    "answer": 1,
    "why": [
      "Mimosa is best known for thigmonasty, so this is partly right. However, the match does not touch the leaf. Here the stimulus is heat.",
      "The match does not touch the leaf, so the stimulus is the sudden rise in temperature. A nastic response to temperature is thermonasty. Mimosa shows both thigmonasty and thermonasty.",
      "A tropism is a slow growth response directed by the stimulus. The leaflets fold within seconds, in the same way whatever side the heat comes from, so this is a nastic response."
    ]
  },
  {
    "concept": "Mechanism",
    "q": "How do the leaflets of Mimosa pudica fold so quickly?",
    "options": [
      "Motor cells in the pulvinus lose water and turgor, so that side of the pulvinus collapses",
      "Cells on one side of the leaf stalk grow rapidly, which bends the leaflets together",
      "Muscle-like fibres in the leaf stalk contract and pull the leaflets together"
    ],
    "answer": 0,
    "why": [
      "At the base of each leaflet is a pulvinus containing large, thin-walled motor cells. When stimulated, the motor cells on one side lose water and turgor, so they can no longer hold the leaflet up and it folds.",
      "Growth is far too slow to fold a leaf within seconds, and it cannot be quickly reversed. Uneven growth is how tropisms work, not this response.",
      "Plants do not have muscles. Their fast movements depend on changes in turgor pressure."
    ]
  },
  {
    "concept": "Mechanism",
    "q": "Why does water leave the motor cells of the pulvinus when Mimosa is touched?",
    "options": [
      "The motor cells actively pump water out across their membranes using ATP",
      "Auxin moves into the motor cells and causes them to shrink and lose water",
      "Potassium ions move out, lowering the solute concentration, so water follows by osmosis"
    ],
    "answer": 2,
    "why": [
      "Energy is used to move ions, so this is partly right. However, water itself is not pumped. It moves passively by osmosis, following the ions.",
      "Auxin controls cell elongation in tropisms. Fast nastic responses depend on the movement of ions and water, not auxin.",
      "When the motor cells are stimulated, potassium ions move out of them. With fewer solutes inside, water leaves by osmosis, so the cells become flaccid. When ions move back in, water returns and the leaflet reopens."
    ]
  },
  {
    "concept": "Mechanism",
    "q": "Motor cells on opposite sides of a pulvinus act as extensors and flexors. Which statement describes how a leaflet opens?",
    "options": [
      "Extensor cells gain K⁺ and swell with water, while flexor cells lose water and shrink",
      "Flexor cells gain K⁺ and swell with water, while extensor cells lose water and shrink",
      "Extensor and flexor cells both gain K⁺ and swell with water at the same time"
    ],
    "answer": 0,
    "why": [
      "A leaflet opens when the extensor cells take in potassium ions and swell with water, while the flexor cells lose water and shrink. The uneven change in turgor on the two sides bends the pulvinus open.",
      "This is the reverse. When the flexor cells swell and the extensor cells shrink, the leaflet closes.",
      "If both sides swelled equally, the pulvinus would not bend. Movement depends on the two sides changing turgor in opposite directions."
    ]
  },
  {
    "concept": "Adaptive value",
    "q": "A Venus flytrap only closes if its trigger hairs are touched twice within about 20 seconds. Why is this an advantage?",
    "options": [
      "It lets the trap grow towards the insect before it closes",
      "It makes the trap close faster than it would after a single touch",
      "It avoids wasting the trap's limited closures on raindrops or debris"
    ],
    "answer": 2,
    "why": [
      "The trap does not grow towards its prey. Closing is a fast nastic response, not a directed growth response.",
      "The trap closes at the same high speed either way. The double touch decides whether it closes, not how fast.",
      "Closing uses energy, a closed trap photosynthesises less, and each trap can only close a handful of times. A struggling insect usually touches the hairs twice, while a raindrop or falling leaf usually touches only once, so the rule prevents costly false alarms."
    ]
  },
  {
    "concept": "Adaptive value",
    "q": "Why is trapping insects an advantage for the Venus flytrap in its nitrogen-poor bog habitat?",
    "options": [
      "Insects provide most of the plant's energy, replacing the need for photosynthesis",
      "Nitrogen from insects lets it make proteins, chlorophyll and DNA, supporting growth and seeds",
      "Trapping insects stops them from eating the plant's leaves in the bog"
    ],
    "answer": 1,
    "why": [
      "The flytrap still gets its energy from photosynthesis. The insects supply nutrients, mainly nitrogen, rather than energy.",
      "Bog soil holds very little available nitrogen. Nitrogen from digested insects lets the plant make proteins, enzymes, chlorophyll and DNA, so it can grow more leaves, photosynthesise more and put more energy into flowers and seeds.",
      "The insects caught are mostly not herbivores feeding on the plant, and protection is not the main benefit. The flytrap traps insects to gain nitrogen."
    ]
  }
];

const TIPS = {
  "Defining nastic responses": "Compare nastic responses (non-directional, usually turgor-based) with tropisms (directional growth).",
  "Types of nastic response": "Match each type to its stimulus: thigmonasty (touch), thermonasty (temperature), photonasty (light intensity) and nyctinasty (the day and night cycle).",
  "Mechanism": "Explain the turgor mechanism: potassium ions move, water follows by osmosis, and extensor and flexor cells in the pulvinus change turgor in opposite directions.",
  "Adaptive value": "Weigh the costs of a nastic response against its benefits, and link it to survival and reproduction in the plant's habitat."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of nastic responses. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
