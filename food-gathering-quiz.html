<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Gathering Quiz</title>
<style>
  :root {
    /* Human Evolution: bright violet, pink and amber */
    --page: #F5F3FF;          /* lavender page background */
    --deep-forest: #FAF8FF;   /* feedback and concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #EDE9FE;     /* letter circles, dividers */
    --sea-mint: #7C3AED;      /* violet accent */
    --bright: #EC4899;        /* pink */
    --rust: #5B21B6;          /* deep violet text accent */
    --ivory-mint: #1E1B4B;    /* body text */
    --sage-mist: #5B5675;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on violet fills */
    --soft-moss: #5B21B6;     /* button hover */
    --heading: #1E1B4B;       /* headings */
    --good: #15803D;          /* correct */
    --good-tint: #DCFCE7;
    --rose: #DC2626;          /* incorrect */
    --rose-tint: #FEE2E2;
    --mint-tint: #DCFCE7;
    --option-bg: #FAF8FF;
    --track: #DDD6FE;
    --amber: #B45309;         /* principle heading */
    --amber-bar: #F59E0B;
    --amber-tint: #FFFBEB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
  .fb-box.principle { border-left-color: var(--amber-bar); background: var(--amber-tint); }
  .fb-box.principle .fb-head { color: var(--amber) !important; }
  .motif span:nth-child(1) { background: var(--amber-bar); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91606 · Trends in Human Evolution</div>
    <div class="title-row">
      <h1>Food Gathering</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Hunter-gatherers",
    "q": "Which statement best describes a hunter-gatherer way of life?",
    "options": [
      "Living in permanent villages and growing crops in cleared fields",
      "Hunting wild animals and gathering wild plants, moving with the seasons",
      "Keeping herds of domesticated animals and moving them between pastures"
    ],
    "answer": 1,
    "why": [
      "Permanent villages and crops in fields describe agriculture, which began only about 10 000 to 12 000 years ago.",
      "Hunter-gatherers obtain food from wild sources, hunting animals and gathering plants, nuts, seeds and shellfish. Many groups moved through the year to follow seasonal foods. This was the way of life of all humans for most of human history.",
      "Herding domesticated animals is pastoralism, which depends on domestication and came after the hunter-gatherer way of life."
    ],
    "principle": "Ways of obtaining food are defined by whether the food is wild or domesticated, and whether people stay in one place or move. Apply this whenever you classify a way of life, by asking where the food comes from and how settled the people are."
  },
  {
    "concept": "Evidence",
    "q": "On some 2-million-year-old animal bones, stone-tool cut marks lie on top of carnivore tooth marks. What does this most likely show?",
    "options": [
      "Hominins killed the animals, and carnivores ate the leftovers",
      "The cut marks and tooth marks were made at exactly the same time",
      "Carnivores fed on the carcass first, and hominins later scavenged it"
    ],
    "answer": 2,
    "why": [
      "If hominins had fed first, carnivore tooth marks would lie on top of the cut marks. Here the order is the reverse.",
      "When one mark lies over another, the top mark was made later, so they cannot have been made at exactly the same time.",
      "Marks on top must have been made after the marks underneath. Cut marks over tooth marks show that carnivores fed first, and hominins later used stone tools to remove the remaining meat and marrow, which is scavenging."
    ],
    "principle": "When features overlap, the one on top was made later, so the order of layers or marks reveals the sequence of events. Apply this whenever you interpret overlapping evidence, such as marks on bone or layers of rock."
  },
  {
    "concept": "Hunter-gatherers",
    "q": "What is the main advantage of hunting cooperatively in a group?",
    "options": [
      "A group can catch larger or faster prey than one hunter, and share the food",
      "Each hunter needs less food, because the group shares the work",
      "Cooperative hunting removes the need for any tools or weapons"
    ],
    "answer": 0,
    "why": [
      "Working together, hunters can surround, drive or ambush animals too large or fast for one person to catch. The meat is then shared, which also helps group members through unsuccessful days.",
      "Each hunter still needs the same amount of food. The benefit is that the group catches more food overall.",
      "Cooperative hunters still used tools and weapons. Cooperation and tools together made hunting more successful."
    ],
    "principle": "Cooperation is favoured when individuals working together gain more than they could alone, even after the reward is shared. Apply this whenever you explain a cooperative behaviour, by comparing the gain for a group with the gain for an individual acting alone."
  },
  {
    "concept": "Agriculture",
    "q": "Which statement best describes the origins of agriculture?",
    "options": [
      "Agriculture began about 10 000 to 12 000 years ago, with crops such as wheat and barley",
      "Agriculture began about 2 million years ago, when Homo erectus started to grow crops",
      "Agriculture began in many places at once, but only after people had built cities"
    ],
    "answer": 0,
    "why": [
      "Agriculture began about 10 000 to 12 000 years ago. One of the earliest centres was the Fertile Crescent in the Middle East, where wheat and barley were domesticated, along with animals such as sheep and goats.",
      "Homo erectus was a hunter-gatherer. Agriculture is very recent, appearing only in the last 12 000 years or so.",
      "Agriculture began independently in several regions, so this is partly right. However, it came before cities. Farming produced the food surplus that later allowed cities to develop."
    ],
    "principle": "Major changes in how humans live are very recent compared with the millions of years of hominin evolution. Apply this whenever you place a cultural change on a timeline, by checking it against the much longer history of hunting and gathering."
  },
  {
    "concept": "Agriculture",
    "q": "Wild wheat scatters its seeds when ripe, but domesticated wheat keeps its seeds on the stalk. Why did this change happen?",
    "options": [
      "In the wild, natural selection favoured wheat plants that kept their seeds",
      "The plants learned to keep their seeds because the farmers needed them",
      "Farmers replanted seed from plants that kept it, so the trait spread"
    ],
    "answer": 2,
    "why": [
      "In the wild, scattering seeds is an advantage, because it spreads the next generation. Keeping seeds on the stalk would be selected against in the wild.",
      "Plants cannot learn or respond to what farmers need. The change happened over many generations through which plants were allowed to reproduce.",
      "When farmers harvested wheat, they gathered mostly the seeds still on the stalk, and replanted some of them. Each generation, plants that kept their seeds contributed more offspring, so the trait became common. This is artificial selection."
    ],
    "principle": "In artificial selection, humans decide which individuals reproduce, so traits useful to humans increase, even if those traits would be a disadvantage in the wild. Apply this whenever you explain a domesticated plant or animal trait, by asking which individuals people chose to breed from."
  },
  {
    "concept": "Consequences",
    "q": "Which list best describes consequences of the change to agriculture?",
    "options": [
      "Permanent villages, food surpluses, larger populations and specialised jobs",
      "A more mobile lifestyle, smaller populations and less need for storage",
      "A more varied diet, fewer infectious diseases and less work for each person"
    ],
    "answer": 0,
    "why": [
      "Farming tied people to their fields, so they lived in permanent villages. Crops could be stored as a surplus, which supported larger populations and freed some people to specialise in jobs such as toolmaking and building.",
      "This describes the hunter-gatherer way of life, not agriculture.",
      "Early farming actually narrowed the diet and increased infectious disease, and it often involved more work, not less."
    ],
    "principle": "A major change in how food is produced has knock-on effects on settlement, population and social organisation. Apply this whenever you explain the impact of a new technology, by tracing how the first change led to the next."
  },
  {
    "concept": "Consequences",
    "q": "Which statement about the disadvantages of early agriculture is most correct?",
    "options": [
      "Diets became less varied, crowding spread disease, and crop failure could cause famine",
      "Early farming had no disadvantages, which is why it spread so quickly",
      "The only disadvantage was that farming required more land"
    ],
    "answer": 0,
    "why": [
      "Relying on a few starchy crops narrowed the diet. People living close together, and near animals, spread infectious diseases more easily. And depending on a few crops meant that one poor harvest could cause famine.",
      "Farming did have costs. It spread because its benefits, especially more food per area, outweighed those costs for the population as a whole.",
      "Farming actually produces more food from less land than hunting and gathering. Its disadvantages were related to diet, disease and food security."
    ],
    "principle": "Most major changes bring both benefits and costs, so evaluating them means weighing one against the other. Apply this whenever you are asked to evaluate a change, by naming specific benefits and costs and judging which is greater."
  },
  {
    "concept": "Evidence",
    "q": "Skeletons from an early farming village show people were shorter, with more tooth decay and more signs of poor nutrition, than earlier hunter-gatherers. Which conclusion is most correct?",
    "options": [
      "Farming was a complete failure, and the villages must soon have been abandoned",
      "The farmers must have been a different species with a smaller body size",
      "A starchy, narrow diet harmed health even as populations grew"
    ],
    "answer": 2,
    "why": [
      "Farming populations grew and spread, so farming was not a failure overall. The skeletons show costs to individual health, not the collapse of farming.",
      "Early farmers and hunter-gatherers were both Homo sapiens. The differences reflect diet and health, not a different species.",
      "Starchy crops cause more tooth decay, and a narrow diet can lack nutrients, reducing growth. Yet farming produced more food in total, so populations grew. This shows a change can increase population size while worsening individual health."
    ],
    "principle": "A change can benefit a population as a whole while harming individuals within it, so population size and individual health must be judged separately. Apply this whenever you evaluate the success of a change, by asking whether you are measuring the group or the individual."
  },
  {
    "concept": "Consequences",
    "q": "Why did agriculture spread so widely, despite its costs to health?",
    "options": [
      "Farming was much easier and needed far less work than hunting and gathering",
      "Farming produced more food per area, so farming populations grew larger and spread",
      "Hunter-gatherers were forced to become farmers by law"
    ],
    "answer": 1,
    "why": [
      "Farming usually needed more work, such as clearing, planting, weeding and harvesting.",
      "A field of crops can feed far more people than the same area of wild land. Farming populations therefore grew larger and spread into new areas, often replacing or absorbing smaller hunter-gatherer groups.",
      "There is no evidence of laws forcing people to farm at this early stage. Farming spread because of its effect on population size."
    ],
    "principle": "A way of life can spread because it supports more people, even if it is not better for each individual. Apply this whenever you explain why a cultural practice spread, by asking how it affected the number of people who could be supported."
  },
  {
    "concept": "Consequences",
    "q": "Which statement comparing hunter-gatherers and early farmers is most correct?",
    "options": [
      "Hunter-gatherers and early farmers had the same diet, health and population density",
      "Hunter-gatherers were always hungry, while early farmers always had plenty of food",
      "Hunter-gatherers had varied diets and fewer crowd diseases, but farming fed far more people per area"
    ],
    "answer": 2,
    "why": [
      "The two ways of life differed greatly in diet, health and how many people a given area could support.",
      "Many hunter-gatherer groups had reliable, varied food, while early farmers could suffer famine when crops failed.",
      "Hunter-gatherers ate a wide range of wild foods and lived in small, mobile groups, where crowd diseases spread less easily. Farming, however, could support many more people on the same area of land."
    ],
    "principle": "A balanced comparison weighs the strengths and weaknesses of both options, rather than treating one as simply better. Apply this whenever you are asked to compare two ways of life, technologies or adaptations."
  }
];

const TIPS = {
  "Hunter-gatherers": "Describe the hunter-gatherer way of life, and the advantages of cooperative hunting.",
  "Evidence": "Practise interpreting evidence such as cut marks on bones and skeletons from early farmers.",
  "Agriculture": "Describe when and where agriculture began, and explain domestication as artificial selection.",
  "Consequences": "Weigh the benefits and costs of agriculture, and explain why it spread despite its costs."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  if (item.principle) html += '<div class="fb-box principle"><div class="fb-head">The underlying principle</div><p>' + item.principle + '</p></div>';
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of food gathering in human evolution. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
