<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooperative Behaviour Quiz</title>
<style>
  :root {
    /* Orange palette, matching the AS91603 Plant and Animal Responses slides */
    --page: #FFF4E0;          /* page background */
    --deep-forest: #FFF9EF;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #FDE6C6;     /* letter circles, dividers */
    --sea-mint: #EA580C;      /* orange accent */
    --bright: #F59E0B;        /* amber */
    --rust: #9A3412;          /* rust text accent */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #6B4E3D;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on orange fills */
    --soft-moss: #9A3412;     /* button hover */
    --heading: #1E293B;       /* headings */
    --good: #2F7D4F;          /* correct */
    --good-tint: #E4F3E9;
    --rose: #B42318;          /* incorrect */
    --rose-tint: #FDECEA;
    --mint-tint: #E4F3E9;
    --option-bg: #FFF8EC;
    --track: #FCE3BE;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91603 · Plant and Animal Responses</div>
    <div class="title-row">
      <h1>Cooperative Behaviour</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Defining cooperation",
    "q": "Which statement best describes cooperative behaviour?",
    "options": [
      "Individuals working together in a way that benefits members of the group",
      "Individuals of the same species trying to obtain the same limited resource",
      "Any behaviour that an animal performs while it is part of a group"
    ],
    "answer": 0,
    "why": [
      "Cooperative behaviour is when individuals act together, or help each other, in a way that benefits members of the group, such as raising young, defending against predators or finding food.",
      "Trying to obtain the same limited resource is competition, which reduces the fitness of both individuals.",
      "Being in a group does not make a behaviour cooperative, so this is partly right. Animals in groups also compete. Cooperation specifically means acting in a way that benefits others in the group."
    ]
  },
  {
    "concept": "Defining cooperation",
    "q": "Which statement best describes altruism?",
    "options": [
      "A behaviour where two different species both benefit from living together",
      "A behaviour that increases another individual's fitness at a cost to the helper's own",
      "A behaviour that increases the helper's own fitness at a cost to others"
    ],
    "answer": 1,
    "why": [
      "Two different species both benefiting is mutualism. Altruism is about one individual paying a cost to help another.",
      "Altruism is helping another individual in a way that costs the helper, for example by using energy, missing a chance to breed, or taking a risk. Explaining why altruism evolves is a central question in studying cooperation.",
      "Benefiting yourself at others' expense is selfish behaviour, the opposite of altruism."
    ]
  },
  {
    "concept": "Benefits and costs",
    "q": "Which list contains only benefits of living in a cooperative group?",
    "options": [
      "Better predator detection, group defence and more competition for mates",
      "Shared care of young, faster spread of disease and group defence",
      "Better predator detection, group defence and help in raising young"
    ],
    "answer": 2,
    "why": [
      "Predator detection and group defence are benefits, so this is partly right. However, more competition for mates is a cost of group living.",
      "Shared care and group defence are benefits, so this is partly right. However, faster spread of disease and parasites is a cost.",
      "More eyes mean predators are spotted sooner, groups can defend themselves together, and helpers can share the work of raising young. These are all benefits."
    ]
  },
  {
    "concept": "Benefits and costs",
    "q": "Which statement about group living is most correct?",
    "options": [
      "Group living always increases the fitness of every member of the group",
      "Groups form when the benefits outweigh costs such as competition and disease",
      "The costs of group living mean it is always a disadvantage"
    ],
    "answer": 1,
    "why": [
      "Group living brings costs as well as benefits, and some members, such as low-ranking individuals, may gain less than others.",
      "Living in a group brings costs, including more competition for food and mates, faster spread of disease and parasites, and being easier for predators to spot. Groups are favoured by natural selection only where the benefits outweigh these costs.",
      "The costs are real, so this is partly right. However, in many species the benefits, such as protection and help raising young, outweigh them."
    ]
  },
  {
    "concept": "Cooperative breeding",
    "q": "In pūkeko groups, several birds share one nest, and adults that are not the parents help incubate the eggs and feed the chicks. This is best described as",
    "options": [
      "brood parasitism",
      "monogamy",
      "cooperative breeding"
    ],
    "answer": 2,
    "why": [
      "Brood parasitism is laying eggs for another species to raise, at a cost to the hosts. Pūkeko are helping within their own group.",
      "In monogamy, a single pair raises the young. Pūkeko groups often have several breeding adults and helpers sharing one nest.",
      "Cooperative breeding is when individuals other than the parents help raise young. Pūkeko helpers, often young birds from earlier seasons, incubate eggs, feed chicks and defend the nest."
    ]
  },
  {
    "concept": "Explaining cooperation",
    "q": "Many pūkeko helpers are older offspring helping to raise their younger siblings. How can helping benefit a helper that does not breed itself?",
    "options": [
      "The helper will always be paid back later by the chicks it has helped to raise",
      "Siblings share many of its alleles, so helping them passes those alleles on",
      "The helper is sterile, so helping others is the only behaviour available to it"
    ],
    "answer": 1,
    "why": [
      "Helpers may gain later benefits, such as experience or a place in the group, so this is partly right. However, being repaid is not guaranteed. The relatedness of the chicks is the main explanation.",
      "Siblings share many of the same alleles. By helping more siblings survive, the helper increases the number of copies of its own alleles passed to the next generation, even without breeding itself. This is kin selection.",
      "Young pūkeko helpers are not sterile. Many go on to breed themselves in later seasons."
    ]
  },
  {
    "concept": "Explaining cooperation",
    "q": "A bird gives an alarm call on seeing a predator, which may draw the predator's attention to itself. Which explanation is most correct?",
    "options": [
      "The bird calls so that its own species does not become extinct in the area",
      "Warning nearby relatives helps pass on shared alleles, despite the risk",
      "Alarm calls carry no risk at all, so calling costs the bird nothing"
    ],
    "answer": 1,
    "why": [
      "Natural selection acts on individuals and their alleles, not for the good of the species. A bird does not call to save its species.",
      "If the birds that hear the call are related to the caller, they share many of its alleles. Saving them can pass on more copies of those alleles than the caller risks losing, so alarm calling can be favoured by kin selection.",
      "Calling can attract the predator's attention, which is why it is a costly, altruistic behaviour that needs explaining."
    ]
  },
  {
    "concept": "Cooperation in action",
    "q": "Pīwakawaka, tauhou and other small birds gather around a ruru (morepork) roosting in daylight, calling loudly and flying at it. This is best described as",
    "options": [
      "predation, because the small birds are attacking the ruru",
      "territory defence, because each bird is defending its own area",
      "mobbing, a form of cooperative defence"
    ],
    "answer": 2,
    "why": [
      "The small birds do not kill or eat the ruru, so this is not predation.",
      "Each bird may be protecting the area it uses, so this is partly right. However, birds of several species join together against a shared predator, which is mobbing.",
      "Mobbing is when prey animals gather to harass a predator. It warns others of the predator's location and can drive it away, so the group benefits from acting together."
    ]
  },
  {
    "concept": "Cooperation in action",
    "q": "In experiments, pairs of kea could only get food by pulling both ends of a string at the same time. Kea often waited for their partner before pulling. What does this show?",
    "options": [
      "Kea can coordinate their actions with a partner to gain a shared reward",
      "Kea could get the food alone, so cooperation was not needed",
      "Kea compete for all food, so they are unable to cooperate"
    ],
    "answer": 0,
    "why": [
      "Waiting for a partner before pulling shows the kea understood that both birds had to act together. This shows the ability to coordinate actions with another individual to gain a shared reward.",
      "The task was designed so that one kea pulling alone could not get the food, so cooperation was needed.",
      "Kea do compete for food, so this is partly right. However, the results show they can also cooperate when a task requires it."
    ]
  },
  {
    "concept": "Explaining cooperation",
    "q": "Unrelated animals sometimes help each other, such as by grooming. Which condition makes this kind of reciprocal help most likely to evolve?",
    "options": [
      "Individuals meet often and remember who has helped them before",
      "Individuals rarely meet the same partner more than once in their lives",
      "Helping costs the helper nothing, so there is no reason not to help"
    ],
    "answer": 0,
    "why": [
      "Reciprocal altruism is helping an unrelated individual who is likely to return the help later. It is favoured when individuals live in stable groups, meet repeatedly, and can recognise and remember who has helped them and who has not.",
      "If individuals rarely meet again, a helper is unlikely to be repaid, so helping would not be favoured.",
      "If helping cost nothing, it would not be altruism. Reciprocal altruism explains help that does have a cost, which is repaid later."
    ]
  }
];

const TIPS = {
  "Defining cooperation": "Define cooperative behaviour and altruism, and compare them with competition and mutualism.",
  "Benefits and costs": "List the benefits and costs of group living, and explain why groups form only when benefits outweigh costs.",
  "Cooperative breeding": "Describe cooperative breeding in pūkeko, including who the helpers are and what they do.",
  "Explaining cooperation": "Explain altruism using kin selection (helping relatives) and reciprocal altruism (help that is returned).",
  "Cooperation in action": "Use mobbing and the kea string-pulling experiments as examples of cooperation in action."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of cooperative behaviour. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
