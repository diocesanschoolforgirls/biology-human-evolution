<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Species Concept Quiz</title>
<style>
  :root {
    /* Teal palette, matching the AS91605 Speciation activity slides */
    --page: #E2F8F4;          /* page background */
    --deep-forest: #F0FBF8;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #D3F1EA;     /* letter circles, dividers */
    --sea-mint: #0F766E;      /* deep teal accent */
    --bright: #14B8A6;        /* bright teal */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #4A6461;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on teal fills */
    --soft-moss: #115E59;     /* button hover */
    --heading: #1E293B;       /* headings */
    --rose: #B4534B;
    --rose-tint: #FCEDEB;
    --mint-tint: #D5F5EE;
    --option-bg: #F1FAF8;
    --track: #C9EEE6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 12px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91605 · Evolutionary Processes</div>
    <div class="title-row">
      <h1>The Species Concept</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. More than one answer may sound right, so choose the most correct one.</p>
    <div class="divider"></div>
  </header>

  <div class="progress-row" id="progressRow">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Question 1 of 10</div>
  </div>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    concept: "Biological species concept",
    q: "Which statement best describes a species, using the biological species concept?",
    options: [
      "A group of populations whose members interbreed in nature to produce fertile offspring",
      "A group of organisms that are classified together because they share the same physical features",
      "A group of organisms that can mate with each other in the wild and produce offspring"
    ],
    answer: 0,
    why: [
      "The biological species concept defines a species by reproduction. Members interbreed in nature and produce fertile offspring, and they are reproductively isolated from other groups, so gene flow happens within the species but not between species.",
      "Grouping organisms by appearance is the morphological species concept. It is useful, especially for fossils, but the biological species concept is based on interbreeding, not appearance. Some species look almost identical, and some members of one species look very different.",
      "Mating and producing offspring is part of the definition, so this is close. However, it leaves out two key ideas: the offspring must be fertile, and the interbreeding must happen in nature. Two species can sometimes produce offspring, but if those offspring are sterile, there is no gene flow."
    ]
  },
  {
    concept: "Biological species concept",
    q: "Two animals mate in the wild and produce healthy offspring, but the offspring cannot reproduce. Under the biological species concept, the parents are",
    options: [
      "the same species, because they mated naturally",
      "separate species, because their offspring are infertile, so no gene flow occurs between the two groups",
      "the same species, because their offspring are healthy"
    ],
    answer: 1,
    why: [
      "Mating in the wild is part of the test, so this is partly right. However, it is not enough. The offspring must also be fertile for gene flow to continue between the groups.",
      "Because the offspring cannot reproduce, no alleles pass from one group into the other's gene pool. The two groups remain reproductively isolated, so they are separate species.",
      "Healthy offspring show the parents are closely related, so this is partly right. However, health is not the test. A healthy but infertile offspring cannot pass alleles on, so the parent groups stay genetically separate."
    ]
  },
  {
    concept: "Biological species concept",
    q: "Which organisms is the biological species concept least able to classify?",
    options: [
      "Two bird populations that live on the same island",
      "Two frog populations separated by a mountain range",
      "Organisms that reproduce asexually, and species known only from fossils"
    ],
    answer: 2,
    why: [
      "Populations on the same island can be observed to see whether they interbreed, so the concept can be applied to them.",
      "Separated populations are harder to test, because they do not meet in nature, so this is partly right. However, they can still be compared, for example by testing whether they interbreed when brought together. The concept struggles far more with the third option.",
      "The biological species concept depends on interbreeding. Asexual organisms, such as many bacteria, do not interbreed at all, and fossils cannot be tested for interbreeding. These groups have to be classified using other evidence, such as appearance or DNA."
    ]
  },
  {
    concept: "Population structure",
    q: "Which statement best describes a subspecies?",
    options: [
      "Populations of the same species that differ in appearance or genetics, usually in different areas, but can still interbreed to produce fertile offspring",
      "A new species that has only recently formed",
      "A population that looks the same as another species but cannot interbreed with it"
    ],
    answer: 0,
    why: [
      "Subspecies are distinct populations within one species. They differ in some features, often because they live in different areas, but they can still interbreed and produce fertile offspring, so they are not separate species.",
      "A subspecies may be on the way to becoming a new species, so this is partly right. However, it is not a species yet, because it can still interbreed and produce fertile offspring with other subspecies.",
      "Organisms that look alike but cannot interbreed are separate species, sometimes called cryptic species. A subspecies is the reverse: it may look different but can still interbreed."
    ]
  },
  {
    concept: "Population structure",
    q: "Which statement best describes a deme?",
    options: [
      "A group of different species living together in the same habitat",
      "A subspecies with a distinct appearance",
      "A local population of a species whose members are most likely to interbreed with each other"
    ],
    answer: 2,
    why: [
      "Different species living together in one habitat is a community. A deme is made up of members of only one species.",
      "A deme and a subspecies are both groups within a species, so this is partly right. However, a deme is defined by who is most likely to interbreed, not by appearance, and it is a smaller, more local group.",
      "A deme is a small, local population within a species. Its members live close together, so they are most likely to breed with each other, which means they share a local gene pool."
    ]
  },
  {
    concept: "Gene flow",
    q: "What effect does gene flow have on populations of the same species?",
    options: [
      "It increases the differences between populations by introducing new alleles",
      "It keeps populations genetically similar by sharing alleles between them",
      "It only occurs between populations of different species"
    ],
    answer: 1,
    why: [
      "Gene flow does bring new alleles into a population, so this is partly right. However, because alleles move in both directions, the overall effect is to make populations more similar to each other, not more different.",
      "Gene flow is the movement of alleles between populations through migration and interbreeding. By sharing alleles, it keeps the gene pools of different populations similar, which holds the species together.",
      "Gene flow occurs within a species. Between different species, reproductive isolation prevents gene flow, which is what keeps species separate."
    ]
  },
  {
    concept: "Clines and hybrid zones",
    q: "Gecko populations in New Zealand show a gradual change in colour from one end of their range to the other, with no sharp boundaries. This is an example of",
    options: [
      "a cline",
      "a hybrid zone",
      "a series of separate species"
    ],
    answer: 0,
    why: [
      "A cline is a gradual change in a feature, or in allele frequency, across a geographic range. Gene flow between neighbouring populations blends the change smoothly, so there are no sharp boundaries.",
      "A hybrid zone is where two distinct populations meet and interbreed. It is a narrow area of mixing, not a gradual change across a whole range.",
      "A gradual change with no boundaries suggests neighbouring populations are still interbreeding. If there were separate species, there would be sharp breaks where gene flow stops."
    ]
  },
  {
    concept: "Clines and hybrid zones",
    q: "Which statement best describes a hybrid zone?",
    options: [
      "An area where two species meet but never interbreed",
      "An area where hybrids are always sterile, so gene flow is completely blocked",
      "An area where two genetically distinct populations meet and interbreed, producing hybrids"
    ],
    answer: 2,
    why: [
      "If the two groups never interbreed, no hybrids are produced, so the area is not a hybrid zone.",
      "Hybrids in these zones often have lower fitness, so this is partly right. However, many hybrids can reproduce, so some gene flow continues. If hybrids were always sterile, gene flow would stop completely.",
      "A hybrid zone is where two distinct populations meet and interbreed. The hybrids may have lower fitness, which can limit gene flow, so hybrid zones show reproductive isolation that is incomplete."
    ]
  },
  {
    concept: "Ring species",
    q: "Ensatina salamanders form a ring of populations around a valley. Neighbouring populations interbreed, but the two populations at the ends of the ring cannot. Which statement is most correct?",
    options: [
      "Each population around the ring is a separate species",
      "It shows that the boundary between species can be gradual, because gene flow links populations that cannot interbreed directly",
      "All the populations are one species, because every population can interbreed with every other"
    ],
    answer: 1,
    why: [
      "Neighbouring populations interbreed and produce fertile offspring, so they are not separate species from each other.",
      "Alleles can pass step by step around the ring through neighbouring populations, even though the two end populations cannot interbreed. This shows speciation can happen gradually, with no single clear line where one species becomes another.",
      "Neighbouring populations can interbreed, so this is partly right. However, the two end populations cannot, so it is not true that every population can interbreed with every other."
    ]
  },
  {
    concept: "Applying to context",
    q: "Domestic dogs, dingoes and grey wolves can interbreed and produce fertile offspring, yet they look and behave differently. Which statement is most correct?",
    options: [
      "They could be one species under the biological species concept, even though other evidence suggests otherwise",
      "They must be separate species, because their appearance and behaviour are too different",
      "They are one species, so differences in their DNA are not relevant to classifying them"
    ],
    answer: 0,
    why: [
      "Because they produce fertile offspring, the biological species concept suggests they could be one species. However, their appearance, behaviour and genetic differences point the other way. This shows that species boundaries can be difficult to draw, and scientists weigh several types of evidence.",
      "Appearance and behaviour are useful evidence, so this is partly right. However, under the biological species concept, the ability to produce fertile offspring outweighs differences in appearance.",
      "DNA evidence is central to classification, so it is always relevant. Genetic comparisons help show how closely related these groups are and how long ago they diverged."
    ]
  }
];

const TIPS = {
  "Biological species concept": "Define a species using the biological species concept, including interbreeding in nature and fertile offspring, and know its limits.",
  "Population structure": "Compare a deme (local breeding group) with a subspecies (distinct but still interbreeding populations).",
  "Gene flow": "Explain how gene flow keeps populations of one species genetically similar.",
  "Clines and hybrid zones": "Distinguish a cline (gradual change across a range) from a hybrid zone (where distinct populations meet and interbreed).",
  "Ring species": "Explain how a ring species shows that the boundary between species can be gradual.",
  "Applying to context": "Practise weighing interbreeding evidence against appearance, behaviour and DNA when deciding whether groups are one species."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];

const el = id => document.getElementById(id);

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1);
  el("qText").innerHTML = item.q;
  el("progressText").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("progressFill").style.width = (current / QUESTIONS.length * 100) + "%";

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");
  el("nextBtn").textContent = current === QUESTIONS.length - 1 ? "See my results" : "Next question";
}

function choose(i) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  results[current] = { chosen: i, correct };

  const buttons = el("options").querySelectorAll(".option");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";
  el("progressFill").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";

  const next = el("nextBtn");
  next.classList.remove("hidden");
  next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
    el("quiz").scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    showResults();
  }
}

function showResults() {
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");
  el("progressText").textContent = "Complete";
  el("progressFill").style.width = "100%";

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of the species concept. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  // Group by concept
  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  current = 0;
  results = [];
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (el("quiz").classList.contains("hidden")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  const buttons = el("options").querySelectorAll(".option");
  if (n !== -1 && buttons.length && !buttons[0].disabled) choose(n % 3);
});

render();
</script>
</body>
</html>
