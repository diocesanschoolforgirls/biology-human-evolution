<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyploidy Quiz</title>
<style>
  :root {
    --deep-forest: #1F3D33;
    --pine: #2F5D4E;
    --pine-dark: #295447;
    --sea-mint: #4FAE8C;
    --ivory-mint: #F2FAF6;
    --sage-mist: #A8CBB7;
    --deep-pine: #12241D;
    --soft-moss: #7FA98A;
    --rose: #D98C8C;
    --rose-tint: #4A3434;
    --mint-tint: #285F4C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--deep-forest);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--ivory-mint);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; opacity: .8; }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 12px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--deep-pine); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    box-shadow: 0 3px 10px rgba(0,0,0,.18);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; }
  .q-text em { font-weight: bold; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--deep-forest);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91605 · Evolutionary Processes</div>
    <div class="title-row">
      <h1>Polyploidy</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose an answer to see why it is right or wrong.</p>
    <div class="divider"></div>
  </header>

  <div class="progress-row" id="progressRow">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Question 1 of 10</div>
  </div>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    concept: "Definitions",
    q: "A polyploid organism is one that has",
    options: [
      "one extra copy of a single chromosome",
      "more than two complete sets of chromosomes",
      "chromosomes inherited from two different parent species"
    ],
    answer: 1,
    why: [
      "One extra copy of a single chromosome is called aneuploidy, for example trisomy. Polyploidy involves gaining whole sets of chromosomes, not single chromosomes.",
      "Polyploidy is having more than two complete sets of chromosomes. A triploid has three sets, a tetraploid has four and a hexaploid has six. Whole sets are gained, not individual chromosomes.",
      "Inheriting chromosomes from two species describes a hybrid. A hybrid only becomes polyploid if its chromosome sets then double. The defining feature of polyploidy is the number of complete sets."
    ]
  },
  {
    concept: "Meiosis and gametes",
    q: "Nondisjunction is",
    options: [
      "the failure of chromosomes to separate correctly during meiosis",
      "the exchange of genetic material between chromosomes during crossing over",
      "the fusion of two haploid gametes at fertilisation"
    ],
    answer: 0,
    why: [
      "Nondisjunction is the failure of chromosomes to separate correctly during meiosis. If every homologous pair fails to separate, the gamete keeps the full diploid set of chromosomes.",
      "Crossing over swaps sections between homologous chromosomes in prophase I. It creates new combinations of alleles, but it does not change the chromosome number.",
      "The fusion of two haploid gametes is normal fertilisation, which produces a diploid zygote. Nondisjunction happens earlier, while the gametes are being formed."
    ]
  },
  {
    concept: "Meiosis and gametes",
    q: "When nondisjunction occurs during meiosis, the gamete produced is",
    options: [
      "a haploid gamete (n)",
      "a triploid gamete (3n)",
      "an unreduced gamete (2n)"
    ],
    answer: 2,
    why: [
      "A haploid gamete is what normal meiosis produces. Nondisjunction stops the chromosome number from being halved, so the gamete is not haploid.",
      "A triploid gamete would need three sets of chromosomes. Nondisjunction in a diploid cell can only keep the two sets that were already there, not create a third.",
      "Because the chromosomes fail to separate, the number is not halved and the gamete keeps both sets (2n). It is called unreduced because the usual reduction from 2n to n did not happen."
    ]
  },
  {
    concept: "Types of polyploidy",
    q: "Allopolyploidy differs from autopolyploidy because allopolyploidy",
    options: [
      "occurs within a single species",
      "begins with hybridisation between two different species",
      "does not involve any change in chromosome number"
    ],
    answer: 1,
    why: [
      "Polyploidy within a single species is autopolyploidy. Auto means self, so all the chromosome sets come from the same species.",
      "Allopolyploidy begins when two different species hybridise. The hybrid is usually sterile because its chromosomes have no matching partners. If the chromosome number then doubles, every chromosome gains a partner and the plant becomes fertile.",
      "Both types involve a change in chromosome number. That change is exactly what makes polyploidy work as a reproductive isolating mechanism."
    ]
  },
  {
    concept: "Reproductive isolation",
    q: "A tetraploid plant crosses with a diploid plant of its parent species. The triploid offspring are sterile because",
    options: [
      "they have too many chromosomes to survive",
      "triploid cells cannot divide by mitosis",
      "their chromosomes cannot pair evenly during meiosis"
    ],
    answer: 2,
    why: [
      "Triploid plants usually survive and grow well, and seedless bananas are triploid. The problem is reproduction, not survival.",
      "Mitosis copies each chromosome and does not need chromosomes to pair, so triploid cells divide and grow normally. Sterility comes from meiosis, not mitosis.",
      "In meiosis, homologous chromosomes must pair up. With three copies of each chromosome, one is always left without a partner, so the gametes receive unbalanced chromosome numbers and are not viable. This sterility blocks gene flow between the tetraploid and diploid populations."
    ]
  },
  {
    concept: "Speciation and patterns",
    q: "Polyploidy is described as a form of sympatric speciation because",
    options: [
      "the new species forms in the same geographic area as the parent species",
      "a geographic barrier separates the polyploid from the parent population",
      "the polyploid migrates to a new habitat before breeding"
    ],
    answer: 0,
    why: [
      "Sympatric speciation happens in the same geographic area. A polyploid is reproductively isolated by its chromosome number while living right alongside the parent population, so no physical barrier is needed.",
      "A geographic barrier separating populations describes allopatric speciation. Polyploidy isolates individuals by chromosome number, not by distance or physical barriers.",
      "The polyploid does not need to move anywhere. The isolating barrier is chromosomal, and it exists from the very first generation wherever the plant grows."
    ]
  },
  {
    concept: "Polyploidy in plants and animals",
    q: "Polyploidy is more common as a speciation mechanism in plants than in animals because",
    options: [
      "plant cells do not undergo meiosis",
      "many plants can self-fertilise or reproduce vegetatively, so a single polyploid can establish a population",
      "nondisjunction cannot occur in animal cells"
    ],
    answer: 1,
    why: [
      "Plants do undergo meiosis to produce the gametes in pollen and ovules. Nondisjunction during this meiosis is exactly how unreduced gametes arise in plants.",
      "A new polyploid has no partners with a matching chromosome number. Many plants can self-fertilise or reproduce asexually, so one individual can found a whole population. Most animals need a separate mate, so a lone polyploid animal usually cannot reproduce.",
      "Nondisjunction does occur in animals, and the gray treefrog shows polyploid speciation can happen in animals. It is simply less often successful in animals than in plants."
    ]
  },
  {
    concept: "Chromosome numbers",
    q: "Kūmara is a hexaploid with a somatic chromosome number of 2n = 90. How many chromosomes are present in a kūmara gamete?",
    options: ["15", "90", "45"],
    answer: 2,
    why: [
      "15 is the number of chromosomes in one set, because six sets of 15 make 90. A gamete carries half the somatic number, not just one set.",
      "90 is the somatic number (2n), found in body cells. Meiosis halves the chromosome number, so a gamete cannot contain 90.",
      "Gametes contain half the somatic number, so n = 90 ÷ 2 = 45. Because kūmara is hexaploid, each gamete carries three of the six chromosome sets."
    ]
  },
  {
    concept: "Chromosome numbers",
    q: "The diploid treefrog <em>Dryophytes chrysoscelis</em> (2n = 24) mates with the tetraploid <em>Dryophytes versicolor</em> (2n = 48). The offspring would be",
    options: [
      "triploid (2n = 36) and sterile",
      "tetraploid (2n = 48) and fertile",
      "diploid (2n = 24) and fertile"
    ],
    answer: 0,
    why: [
      "The diploid parent's gamete carries 12 chromosomes and the tetraploid parent's gamete carries 24. Together they make 36, which is three sets of 12, so the offspring is triploid. Its chromosomes cannot pair evenly in meiosis, so it is sterile and gene flow between the two species is blocked.",
      "48 is the chromosome number of the tetraploid parent. Each offspring receives one gamete from each parent, so it gets 12 + 24 = 36, not 48.",
      "24 is the chromosome number of the diploid parent. The tetraploid's gamete alone brings 24 chromosomes, so the offspring must have more than 24."
    ]
  },
  {
    concept: "Speciation and patterns",
    q: "Speciation by polyploidy is best described as an example of",
    options: [
      "gradualism, because chromosome sets accumulate slowly over millions of years",
      "punctuated equilibrium, because a new species can form in a single generation",
      "convergent evolution, because unrelated species develop the same chromosome number"
    ],
    answer: 1,
    why: [
      "Gradualism is slow, continuous change that builds up over long periods. Polyploidy doubles the chromosome number in a single event, not gradually.",
      "Punctuated equilibrium is rapid change in short bursts, followed by long periods of stability. A polyploid can be reproductively isolated in one generation, making it an instant species.",
      "Convergent evolution is when unrelated species evolve similar features because they face similar selection pressures. Polyploidy explains how a new species forms, not why unrelated species look alike."
    ]
  }
];

const TIPS = {
  "Definitions": "Polyploidy means whole extra sets of chromosomes. Practise defining polyploid, diploid, triploid, tetraploid and hexaploid in one sentence each.",
  "Meiosis and gametes": "Revisit how nondisjunction in meiosis produces an unreduced (2n) gamete instead of a normal haploid (n) gamete.",
  "Types of polyploidy": "Compare autopolyploidy (one species, chromosomes double) with allopolyploidy (two species hybridise, then chromosomes double).",
  "Reproductive isolation": "Review why triploid offspring are sterile: chromosomes cannot pair evenly in meiosis, so gene flow is blocked.",
  "Speciation and patterns": "Link polyploidy to sympatric speciation (same area, no barrier) and to punctuated equilibrium (a new species in one generation).",
  "Polyploidy in plants and animals": "Explain why self-fertilisation and vegetative reproduction let a single polyploid plant found a new population.",
  "Chromosome numbers": "Practise the arithmetic: gametes carry half the somatic number (n = 2n ÷ 2), and offspring receive one gamete from each parent."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];

const el = id => document.getElementById(id);

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1);
  el("qText").innerHTML = item.q;
  el("progressText").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("progressFill").style.width = (current / QUESTIONS.length * 100) + "%";

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");
  el("nextBtn").textContent = current === QUESTIONS.length - 1 ? "See my results" : "Next question";
}

function choose(i) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  results[current] = { chosen: i, correct };

  const buttons = el("options").querySelectorAll(".option");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the right answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not quite. Here is why ' + LETTERS[i] + ' is incorrect.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is correct</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";
  el("progressFill").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";

  const next = el("nextBtn");
  next.classList.remove("hidden");
  next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
    el("quiz").scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    showResults();
  }
}

function showResults() {
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");
  el("progressText").textContent = "Complete";
  el("progressFill").style.width = "100%";

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of polyploidy. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Polyploidy has a lot of new vocabulary. Work through the concept tips below, then have another go."; }

  // Group by concept
  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  current = 0;
  results = [];
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (el("quiz").classList.contains("hidden")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  const buttons = el("options").querySelectorAll(".option");
  if (n !== -1 && buttons.length && !buttons[0].disabled) choose(n % 3);
});

render();
</script>
</body>
</html>
