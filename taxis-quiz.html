<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxis Quiz</title>
<style>
  :root {
    /* Orange palette, matching the AS91603 Plant and Animal Responses slides */
    --page: #FFF4E0;          /* page background */
    --deep-forest: #FFF9EF;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #FDE6C6;     /* letter circles, dividers */
    --sea-mint: #EA580C;      /* orange accent */
    --bright: #F59E0B;        /* amber */
    --rust: #9A3412;          /* rust text accent */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #6B4E3D;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on orange fills */
    --soft-moss: #9A3412;     /* button hover */
    --heading: #1E293B;       /* headings */
    --good: #2F7D4F;          /* correct */
    --good-tint: #E4F3E9;
    --rose: #B42318;          /* incorrect */
    --rose-tint: #FDECEA;
    --mint-tint: #E4F3E9;
    --option-bg: #FFF8EC;
    --track: #FCE3BE;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91603 · Plant and Animal Responses</div>
    <div class="title-row">
      <h1>Taxis</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    concept: "Defining taxis",
    q: "Which statement best describes a taxis?",
    options: [
      "A directional movement of a whole organism towards or away from a stimulus",
      "A change in an organism's speed or turning rate, regardless of stimulus direction",
      "A directional growth response of part of a plant towards or away from a stimulus"
    ],
    answer: 0,
    why: [
      "A taxis is a movement of the whole organism, and its direction is set by the direction of the stimulus. Movement towards the stimulus is positive taxis, and movement away from it is negative taxis.",
      "A change in speed or turning rate that is not directed by the stimulus is a kinesis. In a kinesis, the organism does not move towards or away from the source.",
      "A directional growth response is a tropism. Tropisms are growth responses by part of a plant, while taxes are movements of a whole organism."
    ]
  },
  {
    concept: "Types of taxis",
    q: "An earthworm on the soil surface moves directly away from a bright light. This response is",
    options: [
      "positive phototaxis",
      "negative phototaxis",
      "negative geotaxis"
    ],
    answer: 1,
    why: [
      "The stimulus is light, so phototaxis is the right type. However, positive means moving towards the stimulus, and the earthworm moves away.",
      "The stimulus is light (photo-), the movement is directed by the light (taxis), and the earthworm moves away from it (negative). Moving away from light helps it avoid drying out and being seen by predators.",
      "Geotaxis is a response to gravity, and negative geotaxis is movement upwards. Here the stimulus is light, not gravity."
    ]
  },
  {
    concept: "Types of taxis",
    q: "Juvenile īnanga (whitebait) swim upstream, keeping their heads pointed into the water current. This response is",
    options: [
      "negative rheotaxis",
      "positive chemotaxis",
      "positive rheotaxis"
    ],
    answer: 2,
    why: [
      "The stimulus is the water current, so rheotaxis is the right type. However, negative rheotaxis would mean moving with the current, away from its source. The īnanga swim into it.",
      "Fish can follow chemical cues in the water, so this is partly right. However, orienting to face into a current and swimming against it is a response to the current itself.",
      "Rheotaxis is a response to a water current. Swimming into the current, towards its source, is positive rheotaxis. This carries the juvenile fish upstream into the freshwater habitats where they grow."
    ]
  },
  {
    concept: "Types of taxis",
    q: "Female mosquitoes fly towards the carbon dioxide breathed out by a person. This response is",
    options: [
      "positive thermotaxis",
      "positive chemotaxis",
      "positive phototaxis"
    ],
    answer: 1,
    why: [
      "Mosquitoes are also drawn to body heat at close range, so this is partly right. However, carbon dioxide is a chemical, so the response described here is to a chemical stimulus, not heat.",
      "Carbon dioxide is a chemical stimulus, and the mosquito moves towards it, so this is positive chemotaxis. It leads the mosquito to a host for the blood meal it needs to produce eggs.",
      "Phototaxis is a response to light. The stimulus here is carbon dioxide."
    ]
  },
  {
    concept: "Tropotaxis",
    q: "Which statement best describes tropotaxis?",
    options: [
      "Using a single receptor and swinging from side to side to compare intensity over time",
      "Moving randomly, but more quickly, until conditions improve",
      "Using paired receptors to compare stimulus intensity on each side at the same time"
    ],
    answer: 2,
    why: [
      "Using a single receptor and swinging from side to side is klinotaxis. In klinotaxis, the comparisons are made one after another, not at the same time.",
      "Random movement that changes in speed is a kinesis, which is not directed at all.",
      "In tropotaxis, the organism has receptors on both sides of its body and compares the stimulus they detect at the same moment. It turns until the input is balanced, which points it directly towards or away from the source."
    ]
  },
  {
    concept: "Tropotaxis",
    q: "A blowfly normally flies straight towards a light. When one of its eyes is covered, it flies in circles. Which explanation is most correct?",
    options: [
      "It uses tropotaxis, so with one eye covered the input is unbalanced and it keeps turning",
      "It uses klinotaxis, so it needs both eyes to swing its head from side to side",
      "Covering one eye halves the light it detects, so it moves more slowly and randomly"
    ],
    answer: 0,
    why: [
      "A fly using tropotaxis turns until the light reaching both eyes is balanced. With one eye covered, the input can never balance, so it keeps turning towards the uncovered side and flies in circles. This is strong evidence that it uses tropotaxis.",
      "Klinotaxis uses a single receptor, not a pair, so covering one eye would not stop it working. The circling shows the fly relies on comparing two receptors.",
      "The fly does detect less light, so this is partly right. However, it does not move randomly. It moves in a consistent circle, which shows its steering depends on comparing both eyes."
    ]
  },
  {
    concept: "Klinotaxis",
    q: "A fly maggot moves away from light, swinging its head from side to side as it crawls. It has light receptors only at its head. Which statement is most correct?",
    options: [
      "This is tropotaxis, because it compares light on both sides of its head",
      "This is klinotaxis, because it compares light at successive positions using one receptor",
      "This is a kinesis, because its side-to-side movement is not directed"
    ],
    answer: 1,
    why: [
      "The maggot does compare light on its left and right, so this is partly right. However, it does so one side after the other, by swinging its head, not at the same time with a pair of receptors.",
      "With only one receptor region, the maggot cannot compare both sides at once. By swinging its head, it samples the light at one position and then another, and steers away from the brighter side. Comparing over time like this is klinotaxis.",
      "The side-to-side swings are part of the steering, but the overall movement is clearly directed away from the light. A kinesis has no direction."
    ]
  },
  {
    concept: "Klinotaxis",
    q: "Why is klinotaxis usually slower and less direct than tropotaxis?",
    options: [
      "Organisms that use klinotaxis have weaker muscles, so they cannot move as quickly",
      "Klinotaxis only works when the stimulus is weak, so the signal is harder to follow",
      "Comparisons are made one after another, so it must keep sampling as it moves"
    ],
    answer: 2,
    why: [
      "The difference is in how the stimulus is sensed, not in muscle strength.",
      "Klinotaxis works across a range of stimulus strengths, so this is incorrect. Its limitation is the way it gathers information, not the strength of the stimulus.",
      "In klinotaxis, the organism detects the stimulus at one position, then another, and compares them. This takes time and produces a zig-zag path, while tropotaxis compares both sides at once and allows a straighter course."
    ]
  },
  {
    concept: "Adaptive value",
    q: "Taxes are innate behaviours. Which statement about this is most correct?",
    options: [
      "The response is genetically determined, so it works the first time without any learning",
      "The response is learned by trial and error, so it improves with experience",
      "The response is innate, so it can never change over many generations"
    ],
    answer: 0,
    why: [
      "Innate behaviours are inherited and present without learning. This means an organism can respond correctly to a stimulus the very first time, which is valuable when a mistake, such as moving into light and drying out, could be fatal.",
      "Learning through trial and error describes learned behaviour, not innate behaviour.",
      "An individual cannot change an innate response, so this is partly right. However, because taxes are inherited, natural selection can change them over many generations, favouring responses that suit the environment."
    ]
  },
  {
    concept: "Adaptive value",
    q: "In caves such as Waitomo, small flying insects are drawn towards the light of titiwai (glowworms) and caught in their sticky threads. Which statement is most correct?",
    options: [
      "The titiwai show positive chemotaxis towards the insects",
      "The insects show positive phototaxis, a response the titiwai exploit to catch prey",
      "The insects show a kinesis, moving randomly until they hit the threads"
    ],
    answer: 1,
    why: [
      "The titiwai larvae stay in place and do not move towards the insects. The response described belongs to the insects, not the titiwai.",
      "The insects move towards the light, so they are showing positive phototaxis. This response usually helps flying insects, for example in finding open sky, but titiwai exploit it by luring them into their threads.",
      "The insects' movement is directed towards the light, so it is a taxis, not a kinesis. A kinesis would not lead them towards the light source."
    ]
  }
];

const TIPS = {
  "Defining taxis": "Compare a taxis (directed whole-body movement) with a kinesis (undirected) and a tropism (plant growth).",
  "Types of taxis": "Practise naming a taxis in three parts: positive or negative, the stimulus prefix (photo-, chemo-, rheo-), then taxis.",
  "Tropotaxis": "Explain how paired receptors compare a stimulus at the same time, and why covering one receptor causes circling.",
  "Klinotaxis": "Explain how a single receptor compares a stimulus over time by side-to-side movement, and why this is slower.",
  "Adaptive value": "Link each taxis to survival or reproduction, and remember that innate responses work without learning."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of taxis. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
