<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manipulative Ability of the Hand Quiz</title>
<style>
  :root {
    /* Human Evolution: bright violet, pink and amber */
    --page: #F5F3FF;          /* lavender page background */
    --deep-forest: #FAF8FF;   /* feedback and concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #EDE9FE;     /* letter circles, dividers */
    --sea-mint: #7C3AED;      /* violet accent */
    --bright: #EC4899;        /* pink */
    --rust: #5B21B6;          /* deep violet text accent */
    --ivory-mint: #1E1B4B;    /* body text */
    --sage-mist: #5B5675;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on violet fills */
    --soft-moss: #5B21B6;     /* button hover */
    --heading: #1E1B4B;       /* headings */
    --good: #15803D;          /* correct */
    --good-tint: #DCFCE7;
    --rose: #DC2626;          /* incorrect */
    --rose-tint: #FEE2E2;
    --mint-tint: #DCFCE7;
    --option-bg: #FAF8FF;
    --track: #DDD6FE;
    --amber: #B45309;         /* principle heading */
    --amber-bar: #F59E0B;
    --amber-tint: #FFFBEB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
  .fb-box.principle { border-left-color: var(--amber-bar); background: var(--amber-tint); }
  .fb-box.principle .fb-head { color: var(--amber) !important; }
  .motif span:nth-child(1) { background: var(--amber-bar); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91606 · Trends in Human Evolution</div>
    <div class="title-row">
      <h1>Manipulative Ability of the Hand</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Grips",
    "q": "Which statement best describes a precision grip?",
    "options": [
      "Holding an object between the tips of the thumb and fingers, allowing fine control",
      "Wrapping the fingers and palm around an object, with the thumb pressing over the top",
      "Hooking the fingers over an object without using the thumb at all"
    ],
    "answer": 0,
    "why": [
      "In a precision grip, small objects are held between the pads of the thumb and one or more fingertips, like holding a pen or threading a needle. It allows small, controlled movements.",
      "Wrapping the whole hand around an object is the power grip, used for force rather than fine control.",
      "Hooking the fingers without the thumb is a hook grip, used by apes when hanging from branches or by people carrying a bag."
    ],
    "principle": "Different grips suit different tasks: the power grip gives force, the precision grip gives fine control, and the hook grip suits hanging and carrying. Apply this whenever a question links a hand feature or a tool to a grip, by asking whether the task needs force or fine control."
  },
  {
    "concept": "Grips",
    "q": "A hominin holds a hammerstone with its fingers wrapped around it and its thumb pressing over the fingers, then strikes a core. This is best described as",
    "options": [
      "a precision grip",
      "a hook grip",
      "a power grip"
    ],
    "answer": 2,
    "why": [
      "A precision grip uses the fingertips and thumb tip for fine control. Here the whole hand is wrapped around the stone to deliver force.",
      "A hook grip does not use the thumb. Here the thumb presses over the fingers to hold the stone firmly.",
      "In a power grip, the fingers and palm wrap around an object and the thumb locks over them. It lets a strong, stable force be applied, as when striking one stone against another."
    ],
    "principle": "Tool making needs both grips: a power grip to strike with force and a precision grip to position and control. Apply this whenever you explain how a stone tool was made or used, by naming which grip each step needs."
  },
  {
    "concept": "Hand structure",
    "q": "Compared with a chimpanzee, the human thumb is long relative to the fingers. What is the main advantage of this?",
    "options": [
      "The thumb can be folded out of the way when the hand is used for climbing",
      "The thumb tip can meet each fingertip, giving a strong precision grip",
      "A longer thumb makes the whole hand larger, heavier and much stronger"
    ],
    "answer": 1,
    "why": [
      "Folding the thumb away is useful for apes when hanging in trees, but a long thumb is no help with that.",
      "Because the human thumb is long relative to the fingers, its tip can meet the pad of each fingertip. This full opposability gives the strong, fine-controlled precision grip needed to make and use tools.",
      "Overall hand size is not the key change. What matters is the length of the thumb compared with the fingers."
    ],
    "principle": "The proportions of a structure, such as thumb length compared with finger length, decide which movements are possible. Apply this whenever you compare a hominin hand with an ape's, by asking how the proportions change what the hand can do."
  },
  {
    "concept": "Interpreting fossils",
    "q": "A fossil hand has long, strongly curved finger bones. Which inference is most reasonable?",
    "options": [
      "The hominin probably spent a lot of time climbing and hanging from branches",
      "The hominin was a skilled tool maker, because long fingers improve precision",
      "The finger shape tells us nothing about how the hand was used"
    ],
    "answer": 0,
    "why": [
      "Finger bones curve as they grow under the stress of gripping and hanging from branches. Long, curved fingers, like a chimpanzee's, form a strong hook for climbing.",
      "Long fingers make the thumb relatively shorter, which reduces precision. Human fingers are shorter and straighter.",
      "Bone shape reflects the forces placed on it during life, so curved finger bones are good evidence of how the hand was used."
    ],
    "principle": "Bones respond to the forces placed on them, so the shape of a fossil bone records how it was used. Apply this whenever you interpret any fossil bone, by asking what repeated activity would produce that shape."
  },
  {
    "concept": "Hand structure",
    "q": "Humans have broad fingertips with wide, sensitive pads. How does this support manipulative ability?",
    "options": [
      "Broad fingertips are mainly for protection when walking on the knuckles",
      "They make the fingers longer, improving the hook grip",
      "They give a larger, sensitive surface for gripping and controlling small objects"
    ],
    "answer": 2,
    "why": [
      "Humans do not knuckle-walk. Knuckle-walking is how chimpanzees and gorillas move on the ground.",
      "Broad fingertips do not make the fingers longer, and the hook grip does not depend on the fingertips.",
      "Broad fingertip bones support wide pads, which increase the contact area with an object and contain many touch receptors. This gives a secure, sensitive grip for holding and controlling small objects such as tools."
    ],
    "principle": "Structures for fine manipulation combine a large contact area with high sensitivity, so the hand can both hold and feel an object. Apply this whenever you explain a feature linked to precision, by naming what it adds to grip and what it adds to sensation."
  },
  {
    "concept": "Explaining the changes",
    "q": "How did bipedalism help make possible the evolution of a more skilful hand?",
    "options": [
      "Walking upright directly made the fingers straighter and the thumb longer",
      "Freed from walking and climbing, hands could be selected for manipulation",
      "Bipedal hominins needed much stronger hands to help support their weight"
    ],
    "answer": 1,
    "why": [
      "Walking does not directly reshape the hand. The hand changed over many generations, because individuals with more skilful hands had an advantage.",
      "Once hominins walked upright, their hands were freed from carrying body weight. Natural selection could then favour features such as a longer thumb and straighter fingers, which improved carrying, tool use and food processing.",
      "Upright walking removed the job of supporting body weight from the hands, so this is the reverse of what happened."
    ],
    "principle": "When a structure is freed from one function, natural selection can reshape it for another. Apply this whenever you explain why a body part changed, by asking what job it stopped doing and what new job it could then be adapted for."
  },
  {
    "concept": "Interpreting fossils",
    "q": "Simple stone tools about 3.3 million years old have been found at Lomekwi in Kenya, earlier than the oldest known fossils of Homo. Which conclusion is most reasonable?",
    "options": [
      "The tools must have been made by an early species of Homo that is still unknown",
      "The dates must be wrong, because only members of Homo could make stone tools",
      "Earlier hominins, such as australopithecines, may have made simple tools"
    ],
    "answer": 2,
    "why": [
      "An undiscovered early Homo is possible, but there is no fossil evidence for it. The more likely explanation is that other hominins living at the time made the tools.",
      "There is no reason to doubt the dates. The idea that only Homo could make tools was an assumption that this evidence challenges.",
      "Australopithecines lived at the right time, and their hands already had some human-like proportions. The tools suggest that some of these hominins had enough manual skill to make simple stone tools."
    ],
    "principle": "When new evidence conflicts with an existing assumption, the assumption may need revising, rather than the evidence being dismissed. Apply this whenever new evidence does not fit the expected pattern, by asking which explanation fits all the evidence best."
  },
  {
    "concept": "Explaining the changes",
    "q": "Which statement best describes how changes in the hand and the brain are thought to have influenced each other?",
    "options": [
      "Better tools gave richer food for bigger brains, which made better tools",
      "The brain enlarged first, and the hand only began to change afterwards",
      "The hand and the brain evolved separately, with no link between them at all"
    ],
    "answer": 0,
    "why": [
      "Tools gave access to energy-rich foods such as meat and bone marrow, which could support a larger, energy-demanding brain. A larger brain allowed more complex tools and skills, which favoured further changes in the hand. Each change reinforced the other.",
      "Hand changes and simple tool use appear early, while brain size increased gradually afterwards. The two changes are thought to have reinforced each other, rather than one coming entirely first.",
      "Hand skill and brain size both increased in the Homo lineage, and tool use links them, so they are not thought to be independent."
    ],
    "principle": "Some traits evolve together in a positive feedback loop, where improvement in one makes further improvement in the other more advantageous. Apply this whenever two traits change together over time, by explaining how each change increased the advantage of the other."
  },
  {
    "concept": "Interpreting fossils",
    "q": "Hand bones of Australopithecus afarensis show human-like proportions, with a relatively long thumb, but also curved finger bones. Which conclusion is most correct?",
    "options": [
      "Its hand was fully modern, so the curved fingers can be ignored",
      "It likely combined some manipulative ability with time spent climbing",
      "Its hand was ape-like, so it could not have handled objects skilfully"
    ],
    "answer": 1,
    "why": [
      "The curved finger bones are evidence of climbing, so they cannot be ignored. Its hand was not fully modern.",
      "The human-like proportions suggest improved grip and manipulation, while the curved fingers suggest regular climbing. Together they show a hand that was partly adapted for each, a mosaic of old and new features.",
      "The relatively long thumb is a human-like feature, which suggests a better grip than an ape's, so this goes too far."
    ],
    "principle": "Fossils often show a mosaic of features, where some parts have changed and others have not, and each feature tells you about a different behaviour. Apply this whenever a fossil has mixed features, by describing what each one suggests, rather than labelling the whole fossil from one feature."
  },
  {
    "concept": "Evidence",
    "q": "Which evidence would most strongly show that a particular hominin species made stone tools?",
    "options": [
      "Hand bones with precision-grip features, found alone with no tools nearby",
      "Stone tools found at a site with no hominin fossils of any kind",
      "Precision-grip hand bones found in the same dated layer as deliberately shaped tools"
    ],
    "answer": 2,
    "why": [
      "Precision-grip features show the hand could make tools, so this is partly right. However, they do not show that it actually did.",
      "Tools show that someone made them, so this is partly right. However, without fossils, we cannot tell which species was responsible.",
      "Hand bones show the ability to make tools, while shaped tools in the same dated layer show that tools were actually made by hominins living there at that time. The two lines of evidence support each other."
    ],
    "principle": "Conclusions are strongest when independent lines of evidence point to the same answer, such as anatomy showing an ability and artefacts showing the behaviour. Apply this whenever you evaluate a claim about past behaviour, by naming each line of evidence and what it adds."
  }
];

const TIPS = {
  "Grips": "Compare the precision, power and hook grips, and which tasks each one suits.",
  "Hand structure": "Link a long thumb, straight fingers and broad fingertips to precision grip and manipulation.",
  "Interpreting fossils": "Practise reading fossil hands: what curved fingers, thumb length and mixed features suggest about behaviour.",
  "Explaining the changes": "Explain how bipedalism freed the hands, and how hand skill, tools and brain size reinforced each other.",
  "Evidence": "Combine anatomical evidence (hand bones) with cultural evidence (tools) to make strong conclusions."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  if (item.principle) html += '<div class="fb-box principle"><div class="fb-head">The underlying principle</div><p>' + item.principle + '</p></div>';
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of changes in the manipulative ability of the hand. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
