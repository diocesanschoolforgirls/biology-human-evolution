<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use of Fire Quiz</title>
<style>
  :root {
    /* Human Evolution: bright violet, pink and amber */
    --page: #F5F3FF;          /* lavender page background */
    --deep-forest: #FAF8FF;   /* feedback and concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #EDE9FE;     /* letter circles, dividers */
    --sea-mint: #7C3AED;      /* violet accent */
    --bright: #EC4899;        /* pink */
    --rust: #5B21B6;          /* deep violet text accent */
    --ivory-mint: #1E1B4B;    /* body text */
    --sage-mist: #5B5675;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on violet fills */
    --soft-moss: #5B21B6;     /* button hover */
    --heading: #1E1B4B;       /* headings */
    --good: #15803D;          /* correct */
    --good-tint: #DCFCE7;
    --rose: #DC2626;          /* incorrect */
    --rose-tint: #FEE2E2;
    --mint-tint: #DCFCE7;
    --option-bg: #FAF8FF;
    --track: #DDD6FE;
    --amber: #B45309;         /* principle heading */
    --amber-bar: #F59E0B;
    --amber-tint: #FFFBEB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
  .fb-box.principle { border-left-color: var(--amber-bar); background: var(--amber-tint); }
  .fb-box.principle .fb-head { color: var(--amber) !important; }
  .motif span:nth-child(1) { background: var(--amber-bar); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91606 · Trends in Human Evolution</div>
    <div class="title-row">
      <h1>Use of Fire</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Evidence for fire",
    "q": "Which evidence most strongly suggests that hominins controlled fire, rather than a natural wildfire?",
    "options": [
      "Burnt grass and tree stumps spread across a wide area of landscape",
      "A single piece of charcoal found in an ancient soil layer",
      "Ash, burnt bone and heated stones concentrated in one hearth, used again and again"
    ],
    "answer": 2,
    "why": [
      "Widespread burning across a landscape is typical of a wildfire, which hominins did not need to control.",
      "A single piece of charcoal could come from any natural fire. On its own, it does not show that hominins were involved.",
      "A hearth is a small, defined area where burnt material is concentrated. Repeated use of the same spot, especially alongside bones and tools, shows a fire that was deliberately kept and managed, which a wildfire would not produce."
    ],
    "principle": "Evidence of human activity is strongest when it shows patterns nature does not usually produce, such as concentration in one place and repeated use. Apply this whenever you judge whether a feature was made by people or by natural processes."
  },
  {
    "concept": "Evidence for fire",
    "q": "In Wonderwerk Cave in South Africa, burnt bone and plant ash about 1 million years old were found about 30 m inside the cave. Why is this location especially significant?",
    "options": [
      "Wildfires rarely reach deep into caves, so hominins probably kept this fire",
      "Caves always preserve the oldest evidence, so this must be the first use of fire",
      "The ash shows that the cave was struck by lightning many separate times"
    ],
    "answer": 0,
    "why": [
      "A natural fire is very unlikely to start or spread deep inside a cave, and wind is unlikely to carry so much burnt material that far in. This makes it much more likely that hominins brought fire into the cave and maintained it.",
      "Caves do preserve evidence well, so this is partly right. However, preservation does not show this was the first use of fire. Older sites may simply not have survived.",
      "Lightning strikes the outside of caves and open ground. It cannot reach 30 m inside a cave."
    ],
    "principle": "To show a cause was human, rule out the natural alternatives: where natural causes are very unlikely, a human cause becomes much more likely. Apply this whenever you evaluate evidence, by asking which explanations it rules out."
  },
  {
    "concept": "Benefits of fire",
    "q": "Which statement about the benefits of cooking food is most correct?",
    "options": [
      "Cooking increases the total amount of energy that is contained in the food",
      "Cooking softens food, kills microbes and lets the body absorb more energy",
      "Cooking only improves the taste of food, with no effect on health or energy"
    ],
    "answer": 1,
    "why": [
      "Cooking does not add energy to food. It makes more of the energy that is already there easier to digest and absorb, which is a common misconception.",
      "Heat breaks down tough fibres and starches, making food easier to chew and digest, so the body can absorb more of its energy. Cooking also kills many parasites and bacteria, and can break down some toxins in plants.",
      "Cooking does change taste, but it also greatly improves digestibility and food safety."
    ],
    "principle": "Processing food does not create energy, but it can increase how much of the existing energy the body can absorb. Apply this whenever a question links cooking, grinding or other food processing to energy, by separating the energy in food from the energy the body can actually use."
  },
  {
    "concept": "Benefits of fire",
    "q": "Homo erectus had smaller teeth and probably a smaller gut than earlier hominins, despite a larger body. Which explanation is most likely?",
    "options": [
      "A smaller gut and teeth were needed to make room for a larger brain inside the body",
      "Cooked and processed food needed less chewing and digesting, so smaller teeth and guts were favoured",
      "Homo erectus ate less food than earlier hominins, so it needed smaller teeth"
    ],
    "answer": 1,
    "why": [
      "The brain is not in competition with the gut for space. The link is energy: a smaller gut uses less energy, leaving more available for the brain.",
      "Softer, cooked or processed food needs less chewing and is easier to digest, so large teeth and a long gut were no longer needed. A smaller gut also uses less energy, which may have helped support a larger brain. Exactly when fire was first controlled is still debated, so this is a strong hypothesis rather than a proven fact.",
      "Homo erectus had a larger body, so it needed more food energy, not less."
    ],
    "principle": "When a behaviour reduces the work a body part has to do, natural selection can favour a smaller version of that part, freeing energy for other uses. Apply this whenever you explain a reduction in a structure, by asking what behaviour made its full size unnecessary."
  },
  {
    "concept": "Benefits of fire",
    "q": "How did control of fire help hominins spread into colder regions such as Europe?",
    "options": [
      "It kept hominins warm in cold nights and winters, so they could survive there",
      "Fire changed the climate of the whole of Europe, making it as warm as Africa",
      "Fire was only used for cooking, so it had no effect on where hominins lived"
    ],
    "answer": 0,
    "why": [
      "Fire provided warmth during cold nights and winters, reducing the energy hominins needed to keep warm. Together with shelter and clothing, this allowed them to survive in colder regions they could not live in before.",
      "Fire warms the area around it, but it cannot change the climate of a whole region.",
      "Fire had several uses beyond cooking, including warmth, light and protection, which all affected where hominins could live."
    ],
    "principle": "A cultural adaptation can let a species survive in an environment its body alone is not suited to. Apply this whenever you explain how humans reached new environments, by naming the cultural adaptation and the specific challenge it overcame."
  },
  {
    "concept": "Benefits of fire",
    "q": "Which benefit is most closely linked to fire providing light at night?",
    "options": [
      "A higher body temperature, which meant hominins needed less sleep at night",
      "A longer active day, with more time for toolmaking and social contact",
      "Better eyesight, because hominins were exposed to much more light each day"
    ],
    "answer": 1,
    "why": [
      "Firelight does not raise body temperature or reduce the need for sleep.",
      "Firelight extended the time hominins could be active after dark. This gave more time for toolmaking, sharing food and social interaction around the fire, which may have encouraged communication and stronger group bonds.",
      "Exposure to firelight does not improve eyesight. Its benefit was extending the hours available for activity."
    ],
    "principle": "Many cultural adaptations work by giving more time or more energy for other activities. Apply this whenever you explain the benefit of a cultural adaptation, by asking what it allowed people to do more of, or to do at times they could not before."
  },
  {
    "concept": "Controlling fire",
    "q": "Which statement about early hominins and fire is most correct?",
    "options": [
      "Early hominins could make fire whenever they needed it, right from the start",
      "Early hominins never used any fire until they could make it themselves",
      "They probably kept natural fire first, and only later learned to make it"
    ],
    "answer": 2,
    "why": [
      "Making fire on demand needs specific skills and materials, such as striking flint against iron-rich stone or using a fire drill. These are likely to have been learned later.",
      "Hominins could use fire long before they could make it, by taking burning material from natural fires and keeping it alight.",
      "Early hominins probably took fire from natural sources, such as lightning strikes, and kept it burning. Being able to make fire whenever needed came later, and freed them from relying on natural fires."
    ],
    "principle": "Complex skills usually develop in stages, with simpler abilities, such as keeping fire, coming before harder ones, such as making it. Apply this whenever you describe the development of a technology, by placing its stages in a logical order."
  },
  {
    "concept": "Controlling fire",
    "q": "At Pinnacle Point in South Africa, people about 164 000 years ago heated a type of stone before shaping it, which made it easier to flake into sharp tools. What does this show?",
    "options": [
      "Fire was only used for warmth and cooking at this time",
      "Fire was used as a technology to improve materials, which shows planning",
      "The stone became heated by accident when it was left near a campfire"
    ],
    "answer": 1,
    "why": [
      "Heating stone to make better tools is a use of fire beyond warmth and cooking.",
      "Heating the stone carefully, then shaping it, required knowing the effect of heat and planning a multi-step process. This shows fire being used as a technology to change the properties of a material.",
      "Accidental heating would not consistently improve the stone. The heat treatment was controlled, and it was followed by deliberate shaping."
    ],
    "principle": "Using one technology to improve another, such as fire to improve stone, shows planning across several steps. Apply this whenever you assess the complexity of a behaviour, by counting how many separate steps and technologies are combined."
  },
  {
    "concept": "Evidence for fire",
    "q": "Burnt bones are found at a hominin site, but they could have been burnt by a lightning fire. Which additional evidence would best support controlled use of fire?",
    "options": [
      "More burnt bones found scattered across a much wider area of the site",
      "Repeated hearths in one spot, with tools and cut-marked bones nearby",
      "Evidence that the region often had lightning storms at that time"
    ],
    "answer": 1,
    "why": [
      "More scattered burnt bone would fit a wildfire just as well, so it does not help rule out a natural cause.",
      "Hearths reused in the same place, together with stone tools and bones showing cut marks, link the burning directly to hominin activity. This combination is hard to explain by a natural fire.",
      "Frequent lightning would make a natural fire more likely, which weakens the case for controlled fire."
    ],
    "principle": "To support a hypothesis, look for evidence that fits it but does not fit the alternative explanations. Apply this whenever you are asked what evidence would strengthen a conclusion, by choosing evidence that distinguishes between the competing explanations."
  },
  {
    "concept": "Controlling fire",
    "q": "Why is the control of fire considered a cultural adaptation rather than a biological one?",
    "options": [
      "Hominins evolved a gene that allowed them to control fire",
      "Fire only affected hominin culture and had no effect on their bodies",
      "The skills to keep and make fire are passed on by learning, not inherited in genes"
    ],
    "answer": 2,
    "why": [
      "There is no gene for controlling fire. The skills involved are learned.",
      "Fire did affect hominin bodies indirectly, for example through cooked food and its possible link to smaller teeth and guts.",
      "Knowing how to keep, use and make fire is learned by watching and teaching, so it can spread through a group within a generation. Biological adaptations, by contrast, are inherited in genes and change over many generations."
    ],
    "principle": "A cultural adaptation is passed on by learning, while a biological adaptation is passed on in genes, although cultural changes can still create new selection pressures on the body. Apply this whenever you classify an adaptation, by asking how it is passed to the next generation."
  }
];

const TIPS = {
  "Evidence for fire": "Explain what makes evidence of controlled fire convincing: hearths, repeated use, and evidence that rules out natural fires.",
  "Benefits of fire": "Link fire to cooking, warmth, light and protection, and explain how each benefit improved survival.",
  "Controlling fire": "Describe how fire use developed from keeping natural fire to making it, and using it as a technology."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  if (item.principle) html += '<div class="fb-box principle"><div class="fb-head">The underlying principle</div><p>' + item.principle + '</p></div>';
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of the use of fire in human evolution. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
