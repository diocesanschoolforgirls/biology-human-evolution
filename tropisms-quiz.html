<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tropisms Quiz</title>
<style>
  :root {
    /* Orange palette, matching the AS91603 Plant and Animal Responses slides */
    --page: #FFF4E0;          /* page background */
    --deep-forest: #FFF9EF;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #FDE6C6;     /* letter circles, dividers */
    --sea-mint: #EA580C;      /* orange accent */
    --bright: #F59E0B;        /* amber */
    --rust: #9A3412;          /* rust text accent */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #6B4E3D;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on orange fills */
    --soft-moss: #9A3412;     /* button hover */
    --heading: #1E293B;       /* headings */
    --good: #2F7D4F;          /* correct */
    --good-tint: #E4F3E9;
    --rose: #B42318;          /* incorrect */
    --rose-tint: #FDECEA;
    --mint-tint: #E4F3E9;
    --option-bg: #FFF8EC;
    --track: #FCE3BE;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91603 · Plant and Animal Responses</div>
    <div class="title-row">
      <h1>Tropisms</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Defining tropisms",
    "q": "Which statement best describes a tropism?",
    "options": [
      "A directional growth response of part of a plant, set by the direction of the stimulus",
      "A non-directional plant movement, often fast, caused by changes in cell turgor",
      "A movement of a whole organism towards or away from the source of a stimulus"
    ],
    "answer": 0,
    "why": [
      "A tropism is a growth response in which part of a plant grows towards (positive) or away from (negative) a stimulus. The direction of growth depends on the direction the stimulus comes from.",
      "A non-directional movement caused by turgor changes describes many nastic responses. Tropisms are directional and work through growth.",
      "Movement of a whole organism towards or away from a stimulus is a taxis. Plants are fixed in place, so they respond by growing in a particular direction."
    ]
  },
  {
    "concept": "Types of tropism",
    "q": "A germinating bean seed's root (radicle) grows downwards and its shoot (plumule) grows upwards. Which statement is most correct?",
    "options": [
      "The root shows negative gravitropism and the shoot shows positive gravitropism",
      "Both show positive phototropism, growing in the direction they need light",
      "The root shows positive gravitropism and the shoot shows negative gravitropism"
    ],
    "answer": 2,
    "why": [
      "These labels are reversed. Growing towards the pull of gravity, as the root does, is positive gravitropism.",
      "Underground there is no light to respond to, and roots do not need light. These responses are to gravity.",
      "The radicle grows in the direction of gravity, which is positive gravitropism (also called geotropism). The plumule grows against gravity, which is negative gravitropism. Both happen underground, in the dark, so light cannot be the cue."
    ]
  },
  {
    "concept": "Auxin and growth",
    "q": "A seedling on a windowsill bends towards the window. How does auxin cause this?",
    "options": [
      "Light destroys the auxin on the shaded side, so the lit side grows faster",
      "Cells on the lit side lose turgor and shrink, so the shoot bends towards them",
      "Auxin moves to the shaded side, so cells there elongate more than on the lit side"
    ],
    "answer": 2,
    "why": [
      "Auxin does end up unevenly spread, so this is partly right. However, it is moved to the shaded side rather than destroyed there, and it is the shaded side that grows faster.",
      "Loss of turgor is the mechanism of many fast nastic responses. Phototropism is a growth response, caused by uneven cell elongation.",
      "Light causes auxin to be moved from the lit side to the shaded side of the shoot. In shoots, auxin stimulates cell elongation, so the shaded side grows longer than the lit side and the shoot curves towards the light."
    ]
  },
  {
    "concept": "Auxin and growth",
    "q": "A root is placed horizontally. Auxin collects on the lower side, and the root bends downwards. Which explanation is most correct?",
    "options": [
      "In roots, high auxin stimulates elongation, so the lower side grows more than the upper side",
      "In roots, high auxin inhibits elongation, so the lower side grows less than the upper side",
      "The root bends downwards simply because the root tip is heavier than the rest of the root"
    ],
    "answer": 1,
    "why": [
      "This is how auxin works in shoots, so it is partly right. However, if the lower side grew more, the root would bend upwards. In roots, high auxin slows elongation.",
      "Root cells are much more sensitive to auxin than shoot cells, so the concentration that collects on the lower side inhibits their elongation. The upper side keeps growing faster, which curves the root downwards.",
      "Roots bend through uneven growth, not weight. A root tip will bend downwards even when its weight is supported."
    ]
  },
  {
    "concept": "Sensing stimuli",
    "q": "How do plant cells detect the direction of gravity?",
    "options": [
      "Light-detecting proteins in the root tip sense which direction is downwards",
      "Statoliths, which are dense starch-filled organelles, settle to the lowest side of the cells",
      "Auxin is pulled downwards by gravity and collects on the lower side on its own"
    ],
    "answer": 1,
    "why": [
      "Light receptors detect light, not gravity. Roots respond to gravity even in complete darkness.",
      "Cells in the root cap contain statoliths, dense starch-filled organelles. Gravity pulls them to the lowest side of each cell, which signals which way is down and leads to auxin being moved to the lower side.",
      "Auxin does end up on the lower side, so this is partly right. However, auxin is too light to be pulled down by gravity on its own. It is actively transported after statoliths signal the direction of gravity."
    ]
  },
  {
    "concept": "Classic experiments",
    "q": "Charles and Francis Darwin lit grass seedlings from one side. Seedlings with an opaque cap over the tip grew straight up. Those with the lower shoot covered bent towards the light. What does this show?",
    "options": [
      "The light is detected at the tip of the shoot",
      "The shoot needs light to grow at all, so covered tips stop growing",
      "The light is detected by the lower part of the shoot, not the tip"
    ],
    "answer": 0,
    "why": [
      "Bending only stopped when the tip was covered by an opaque cap. Covering the lower shoot, where the bending actually happens, had no effect. So the tip detects the light and sends a signal, later identified as auxin, down to the region that bends.",
      "Light affects the direction of growth, so this is partly right. However, the seedlings with covered tips still grew upwards. They lost the bending response, not the ability to grow.",
      "Covering the lower part of the stem did not stop bending, so the light is not detected there."
    ]
  },
  {
    "concept": "Classic experiments",
    "q": "Shoot tips are placed on an agar block, then removed. The agar block is put on one side of a cut shoot kept in the dark, and the shoot bends away from that side. What does this show?",
    "options": [
      "The agar block physically pushed the shoot over to the other side",
      "Light is needed for the shoot to bend in any direction",
      "A chemical from the tip passed into the agar and caused extra growth on that side"
    ],
    "answer": 2,
    "why": [
      "Plain agar blocks used as a control do not cause bending, so the effect comes from the chemical in the agar, not the block itself.",
      "The shoot was in the dark and still bent, so light was not needed for this bending.",
      "The agar picked up a substance from the shoot tips. Placed on one side, it made that side grow more, so the shoot bent away from it. This showed growth is controlled by a chemical, later identified as auxin."
    ]
  },
  {
    "concept": "Types of tropism",
    "q": "Puawānanga, a native clematis, climbs by wrapping its leaf stalks around branches. The side of the stalk touching the branch grows more slowly than the far side. This response is",
    "options": [
      "thigmonasty",
      "positive thigmotropism",
      "positive phototropism"
    ],
    "answer": 1,
    "why": [
      "Touch is the right stimulus, so this is partly right. However, the coiling direction depends on which side touches the support, and it involves growth, so it is a tropism, not a nastic response.",
      "The stimulus is touch (thigmo-), and the leaf stalk grows more slowly on the side in contact, so it coils around the branch. This is a directional growth response, so it is positive thigmotropism.",
      "Phototropism is a response to light. Here the trigger is contact with the branch."
    ]
  },
  {
    "concept": "Types of tropism",
    "q": "After landing on a stigma, a pollen tube grows down through the style towards the ovule, following chemicals released by the ovule. This is",
    "options": [
      "positive gravitropism",
      "positive hydrotropism",
      "positive chemotropism"
    ],
    "answer": 2,
    "why": [
      "The pollen tube does grow downwards in an upright flower, so this is partly right. However, it is following chemical signals from the ovule, not gravity, and it reaches the ovule in any orientation.",
      "Hydrotropism is growth in response to water. The pollen tube is following chemicals released by the ovule.",
      "The pollen tube grows towards chemicals released by the ovule, which is positive chemotropism. This guides the male gametes to the ovule so fertilisation can take place."
    ]
  },
  {
    "concept": "Adaptive value",
    "q": "A bean seed may germinate in the soil at any angle, even upside down. Why are gravitropisms so important for the young seedling?",
    "options": [
      "Phototropism alone is enough to guide the shoot upwards while it is still underground",
      "Roots grow down to water and anchorage, and shoots grow up to light, whatever the seed's position",
      "They only matter if the seed lands the right way up, so the shoot is already pointing up"
    ],
    "answer": 1,
    "why": [
      "There is no light underground, so phototropism cannot guide the shoot until it reaches the surface.",
      "Underground there is no light, so gravity is the only reliable cue for direction. Positive gravitropism sends roots down to water, minerals and anchorage, while negative gravitropism sends the shoot up so it reaches light before its stored food runs out.",
      "Gravitropisms are most important when a seed is not the right way up, because they turn the root and shoot around to grow in the correct directions."
    ]
  }
];

const TIPS = {
  "Defining tropisms": "Compare tropisms (directional growth) with nastic responses (non-directional) and taxes (whole-organism movement).",
  "Types of tropism": "Name each tropism by its stimulus (photo-, gravi-, thigmo-, chemo-) and whether growth is towards (positive) or away (negative).",
  "Auxin and growth": "Explain why auxin makes shoots bend towards light but roots bend downwards: it stimulates shoot cells but inhibits root cells.",
  "Sensing stimuli": "Explain how statoliths settling in root cap cells detect gravity and lead to auxin moving to the lower side.",
  "Classic experiments": "Practise explaining what the tip-covering and agar-block experiments each show about where light is detected and how growth is controlled.",
  "Adaptive value": "Link each tropism to survival: light for photosynthesis, water and anchorage for roots, support for climbers."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of tropisms. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
