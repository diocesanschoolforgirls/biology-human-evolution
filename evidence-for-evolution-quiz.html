<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence for Evolution Quiz</title>
<style>
  :root {
    /* Teal palette, matching the AS91605 Speciation activity slides */
    --page: #E2F8F4;          /* page background */
    --deep-forest: #F0FBF8;   /* feedback boxes, concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #D3F1EA;     /* letter circles, dividers */
    --sea-mint: #0F766E;      /* deep teal accent */
    --bright: #14B8A6;        /* bright teal */
    --ivory-mint: #1E293B;    /* body text */
    --sage-mist: #4A6461;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on teal fills */
    --soft-moss: #115E59;     /* button hover */
    --heading: #1E293B;       /* headings */
    --rose: #B4534B;
    --rose-tint: #FCEDEB;
    --mint-tint: #D5F5EE;
    --option-bg: #F1FAF8;
    --track: #C9EEE6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 22px; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 12px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91605 · Evolutionary Processes</div>
    <div class="title-row">
      <h1>Evidence for Evolution</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. More than one answer may sound right, so choose the most correct one.</p>
    <div class="divider"></div>
  </header>

  <div class="progress-row" id="progressRow">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Question 1 of 10</div>
  </div>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    concept: "Comparative anatomy",
    q: "Which statement best describes homologous structures?",
    options: [
      "Structures in unrelated species that carry out the same function, such as flight",
      "Structures with the same basic plan, inherited from a common ancestor",
      "Structures that look similar because the species live in similar environments"
    ],
    answer: 1,
    why: [
      "Structures with the same function in unrelated species are analogous structures. Homologous structures are defined by shared ancestry, not shared function.",
      "Homologous structures share the same basic plan because they were inherited from a common ancestor. The human arm, whale flipper and bat wing all have the same arrangement of bones, even though they are used for different things. This is evidence of divergent evolution.",
      "Similar environments can produce structures that look alike, so this is partly right. However, those are analogous structures, produced by convergent evolution. Homologous structures are similar because of shared ancestry, not shared environment."
    ]
  },
  {
    concept: "Comparative anatomy",
    q: "The wings of a bird and the wings of an insect both allow flight, but are built in completely different ways. These wings are best described as",
    options: [
      "homologous structures, because they both evolved for flight",
      "vestigial structures, because they are left over from a shared ancestor",
      "analogous structures, because they evolved independently to do the same job"
    ],
    answer: 2,
    why: [
      "Sharing a function does not make structures homologous. Homologous structures are inherited from a common ancestor, and birds and insects did not inherit wings from a shared winged ancestor.",
      "Vestigial structures are reduced structures that have lost most of their original function. Bird and insect wings are fully functional.",
      "Analogous structures do the same job but evolved independently, in species that did not inherit the feature from a common ancestor. Similar selection pressures, here the advantages of flight, produced similar solutions. This is convergent evolution."
    ]
  },
  {
    concept: "Comparative anatomy",
    q: "Some whales have small pelvic bones that are not attached to the spine. These bones are best described as",
    options: [
      "vestigial structures, suggesting whales descended from land mammals with hind limbs",
      "analogous structures that evolved recently to help whales swim",
      "homologous structures that whales still use to support their hind limbs"
    ],
    answer: 0,
    why: [
      "A vestigial structure is a reduced structure that has lost most or all of its original function. The pelvic bones are evidence that whales evolved from four-legged land mammals, an idea also supported by fossils of early whales with legs.",
      "The bones are not used for swimming, and they are not a recent independent development. They are a reduced remnant of a structure inherited from ancestors.",
      "The pelvic bones are homologous with the pelvis of land mammals, so this is partly right. However, whales do not use them to support hind limbs. Their reduced size and lost function make them vestigial."
    ]
  },
  {
    concept: "Molecular evidence",
    q: "Why can comparing DNA sequences show how closely related two species are?",
    options: [
      "Closely related species have identical DNA sequences, while distant species share none",
      "Mutations build up over time, so species that diverged more recently share more of their DNA sequence",
      "Species that look similar always have similar DNA, so DNA confirms what anatomy shows"
    ],
    answer: 1,
    why: [
      "Closely related species have very similar DNA, so this is partly right. However, their sequences are not identical, and even distantly related species share many sequences. The number of differences is what matters.",
      "After two lineages split, each builds up its own mutations. The longer ago they split, the more differences accumulate, so species with fewer differences in their DNA shared a common ancestor more recently.",
      "Similar-looking species do not always have similar DNA. Convergent evolution can make distantly related species look alike, and DNA is often what reveals this."
    ]
  },
  {
    concept: "Molecular evidence",
    q: "What does a molecular clock allow scientists to estimate?",
    options: [
      "The age of a fossil, by dating the rock layer it was found in",
      "How quickly a species is evolving at the present time, from its DNA",
      "When two lineages diverged, from differences in a steadily mutating gene"
    ],
    answer: 2,
    why: [
      "Rock layers are dated using methods such as radiometric dating. A molecular clock uses DNA or protein differences, not rocks.",
      "A molecular clock does rely on a rate of change, so this is partly right. However, it is used to look back in time, estimating when lineages split, rather than measuring how fast a species is changing now.",
      "If mutations in a gene build up at a fairly steady rate, the number of differences between two species can be converted into an estimate of how long ago they shared a common ancestor. Genes such as cytochrome b are useful because their essential function keeps the mutation rate steady."
    ]
  },
  {
    concept: "Applying to context",
    q: "The lamprey and the longfin eel both have long, slender bodies, but DNA shows they are only distantly related. Which statement is most correct?",
    options: [
      "This is convergent evolution: similar body shapes evolved independently under similar selection pressures",
      "This is divergent evolution: their body shapes are homologous, inherited from a shared ancestor",
      "This is convergent evolution, because they inherited their body shape from a recent common ancestor"
    ],
    answer: 0,
    why: [
      "The lamprey and longfin eel did not inherit their body shape from a shared ancestor. Both faced similar selection pressures in similar habitats, so similar body shapes evolved independently. The body shapes are analogous, and DNA confirms how distantly related they are.",
      "Divergent evolution produces homologous structures from a shared ancestor. The DNA evidence shows these species are only distantly related, so their similar shape was not inherited.",
      "Convergent evolution is the right term, so this is partly right. However, the reason is wrong. Convergent evolution means similar features evolved independently, not that they were inherited from a recent common ancestor."
    ]
  },
  {
    concept: "Fossil record",
    q: "Which statement about the fossil record is most correct?",
    options: [
      "Most organisms that die become fossils, so the record is close to complete",
      "Fossils show how organisms changed over time, and transitional fossils show features between groups",
      "Fossils preserve the DNA of extinct organisms, so they are mainly used for molecular comparisons"
    ],
    answer: 1,
    why: [
      "Very few organisms become fossils, because fossilisation needs rare conditions such as rapid burial. The record has many gaps, and soft-bodied organisms are especially under-represented.",
      "Fossils in rock layers of different ages show how organisms changed over time. Transitional fossils, such as early whales with legs, show features intermediate between groups, which supports common ancestry.",
      "DNA has been recovered from some recent fossils, so this is partly right. However, DNA breaks down over time, so most fossils contain none. Fossils are mainly used for evidence of structure, age and change over time."
    ]
  },
  {
    concept: "Fossil record",
    q: "In undisturbed layers of sedimentary rock, which statement about the fossils is most correct?",
    options: [
      "Fossils in lower layers are generally older than fossils in the layers above them",
      "Fossils in upper layers are older, because they have been exposed for longer",
      "All the fossils in one layer are exactly the same age"
    ],
    answer: 0,
    why: [
      "Sedimentary rock builds up in layers, with newer layers deposited on top of older ones. In undisturbed rock, deeper layers and the fossils in them are generally older, which lets scientists place fossils in time order.",
      "Upper layers were deposited most recently, so their fossils are generally younger, not older. Being near the surface does not make a fossil older.",
      "Fossils in the same layer are from the same general period, so this is partly right. However, one layer can take thousands of years to form, so its fossils are not all exactly the same age."
    ]
  },
  {
    concept: "Biogeography",
    q: "Why are some New Zealand plants and animals closely related to species in Australia and South America?",
    options: [
      "They were carried between these continents by early human travellers",
      "They evolved the same features independently, because the climates are similar",
      "Their ancestors lived on Gondwana, which broke apart and isolated populations"
    ],
    answer: 2,
    why: [
      "People arrived in New Zealand very recently in evolutionary terms. These relationships are millions of years old, far older than any human movement.",
      "Similar climates can produce similar features through convergent evolution, so this is partly right. However, these species are genuinely related, sharing ancestry, not just similar features.",
      "New Zealand, Australia, South America and Antarctica were once joined as Gondwana. As it broke apart, populations of the same ancestors were separated. With no gene flow, they diverged, so related groups are now found on separate landmasses."
    ]
  },
  {
    concept: "Combining evidence",
    q: "Why do scientists combine several types of evidence when studying evolutionary relationships?",
    options: [
      "Molecular evidence is always enough, so other evidence is only used when DNA is unavailable",
      "When independent types of evidence agree, the conclusion is more reliable, because each has different limitations",
      "Fossils are the only direct evidence, so other types are only used to fill gaps"
    ],
    answer: 1,
    why: [
      "Molecular evidence is very powerful, so this is partly right. However, it cannot be gathered from most fossils, and it does not show what extinct organisms looked like or where they lived.",
      "Each type of evidence has weaknesses. The fossil record has gaps, anatomy can be misleading because of convergent evolution, and DNA is rarely available from fossils. When anatomy, fossils, molecular evidence and biogeography all point the same way, the conclusion is much stronger.",
      "Fossils are direct evidence of past life, so this is partly right. However, molecular and anatomical evidence are not just gap-fillers. They often provide the strongest evidence of how living species are related."
    ]
  }
];

const TIPS = {
  "Comparative anatomy": "Compare homologous, analogous and vestigial structures, and link each to divergent or convergent evolution.",
  "Molecular evidence": "Explain why fewer DNA differences mean a more recent common ancestor, and how a molecular clock estimates divergence time.",
  "Applying to context": "Practise using DNA evidence to decide whether a similarity is homologous or analogous.",
  "Fossil record": "Review how rock layers place fossils in time order, why the record has gaps, and what transitional fossils show.",
  "Biogeography": "Link the break-up of Gondwana to isolation, loss of gene flow and divergence of related species.",
  "Combining evidence": "Practise explaining one limitation of each evidence type, and why agreement between them strengthens a conclusion."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];

const el = id => document.getElementById(id);

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1);
  el("qText").innerHTML = item.q;
  el("progressText").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("progressFill").style.width = (current / QUESTIONS.length * 100) + "%";

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");
  el("nextBtn").textContent = current === QUESTIONS.length - 1 ? "See my results" : "Next question";
}

function choose(i) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  results[current] = { chosen: i, correct };

  const buttons = el("options").querySelectorAll(".option");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";
  el("progressFill").style.width = ((current + 1) / QUESTIONS.length * 100) + "%";

  const next = el("nextBtn");
  next.classList.remove("hidden");
  next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
    el("quiz").scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    showResults();
  }
}

function showResults() {
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");
  el("progressText").textContent = "Complete";
  el("progressFill").style.width = "100%";

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of the evidence for evolution. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  // Group by concept
  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  current = 0;
  results = [];
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (el("quiz").classList.contains("hidden")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  const buttons = el("options").querySelectorAll(".option");
  if (n !== -1 && buttons.length && !buttons[0].disabled) choose(n % 3);
});

render();
</script>
</body>
</html>
