<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out of Africa Hypothesis: Self-Marking Quiz</title>
<style>
  :root {
    --chocolate: #3B1F0E;
    --umber: #6B3A2A;
    --ochre: #C4861F;
    --cream: #FAF3E8;
    --sand: #E8D5B0;
    --sage: #7A8C5E;
    --rose: #8B3A3A;
    --dark: #1C1008;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Calibri, Arial, sans-serif;
    background: var(--chocolate);
    color: var(--cream);
    margin: 0;
    padding: 24px 12px 60px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-family: Cambria, Georgia, serif;
    color: var(--ochre);
    font-size: 1.6rem;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--sand);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  .progress-bar {
    background: var(--dark);
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    background: var(--ochre);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }
  .question-card {
    background: var(--umber);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 18px;
    border: 1px solid var(--sand);
  }
  .q-number {
    color: var(--ochre);
    font-weight: bold;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 1.05rem;
    margin-bottom: 14px;
    color: var(--cream);
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--chocolate);
    color: var(--cream);
    border: 1px solid var(--sand);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 0.98rem;
    font-family: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:hover:not(:disabled) {
    background: var(--dark);
    border-color: var(--ochre);
  }
  .option:disabled {
    cursor: default;
  }
  .option.selected-correct {
    background: var(--sage);
    border-color: var(--sage);
    color: var(--dark);
    font-weight: bold;
  }
  .option.selected-wrong {
    background: var(--rose);
    border-color: var(--rose);
    color: var(--cream);
    font-weight: bold;
  }
  .option.reveal-correct {
    border-color: var(--sage);
    border-width: 2px;
  }
  .feedback {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.92rem;
    display: none;
  }
  .feedback.show {
    display: block;
  }
  .feedback.correct {
    background: rgba(122,140,94,0.25);
    border-left: 4px solid var(--sage);
  }
  .feedback.wrong {
    background: rgba(139,58,58,0.25);
    border-left: 4px solid var(--rose);
  }
  .concept-tag {
    display: inline-block;
    background: var(--dark);
    color: var(--sand);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 12px;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }
  #submit-btn, #retry-btn {
    display: block;
    width: 100%;
    background: var(--ochre);
    color: var(--dark);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
  }
  #submit-btn:disabled {
    background: var(--sand);
    color: var(--umber);
    cursor: not-allowed;
  }
  #submit-btn:hover:not(:disabled), #retry-btn:hover {
    background: #d9992e;
  }
  #results {
    display: none;
    background: var(--dark);
    border-radius: 10px;
    padding: 24px;
    margin-top: 20px;
    border: 2px solid var(--ochre);
  }
  #results.show {
    display: block;
  }
  .score-line {
    text-align: center;
    font-size: 1.8rem;
    color: var(--ochre);
    font-weight: bold;
    margin-bottom: 4px;
  }
  .score-sub {
    text-align: center;
    color: var(--sand);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .weak-areas {
    background: var(--umber);
    border-radius: 8px;
    padding: 16px 18px;
    margin-top: 10px;
  }
  .weak-areas h3 {
    color: var(--ochre);
    font-family: Cambria, Georgia, serif;
    font-size: 1.05rem;
    margin-top: 0;
  }
  .weak-areas ul {
    margin: 8px 0 0;
    padding-left: 20px;
  }
  .weak-areas li {
    margin-bottom: 6px;
    color: var(--cream);
  }
  .all-good {
    color: var(--sage);
    font-weight: bold;
  }
  .error-msg {
    color: var(--rose);
    font-size: 0.85rem;
    margin-top: 6px;
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Out of Africa Hypothesis</h1>
  <p class="subtitle">AS91606 &middot; Trends in Human Evolution &middot; 10-question check</p>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

  <div id="quiz-container"></div>

  <button id="submit-btn" disabled>Answer all questions to submit</button>
  <div class="error-msg" id="error-msg">Please answer every question before submitting.</div>

  <div id="results">
    <div class="score-line" id="score-line"></div>
    <div class="score-sub" id="score-sub"></div>
    <div class="weak-areas" id="weak-areas"></div>
    <button id="retry-btn">Try again</button>
  </div>
</div>

<script>
const questions = [
  {
    concept: "Core hypothesis",
    text: "What does the Out of Africa Hypothesis propose about the origin of modern humans?",
    options: [
      { text: "Modern Homo sapiens evolved in a single African population and dispersed to replace archaic populations elsewhere.", correct: true,
        feedback: "Correct. This is the replacement model: one African origin, with limited interbreeding along the way." },
      { text: "Modern humans evolved independently and simultaneously from archaic populations on several continents.", correct: false,
        feedback: "This describes the Multiregional hypothesis, not Out of Africa. Out of Africa proposes a single origin, not several independent ones." },
      { text: "Neanderthals in Europe gradually evolved into modern Homo sapiens.", correct: false,
        feedback: "Neanderthals are a separate lineage that diverged from a common ancestor with Homo sapiens. They did not evolve into modern humans." },
      { text: "Modern humans evolved from Homo erectus populations that had already spread across Europe and Asia.", correct: false,
        feedback: "This mixes up the two dispersal waves. Homo erectus left Africa first, but modern Homo sapiens evolved later, still inside Africa, in a separate population." }
    ]
  },
  {
    concept: "Timeline",
    text: "Around how long ago does the Out of Africa Hypothesis suggest modern Homo sapiens dispersed out of Africa?",
    options: [
      { text: "About 1 million years ago", correct: false,
        feedback: "That is roughly when Homo erectus left Africa, an earlier and separate dispersal event, not the modern human one." },
      { text: "About 60,000 to 70,000 years ago", correct: true,
        feedback: "Correct. This is the timeframe given for the main dispersal of modern Homo sapiens out of Africa." },
      { text: "About 200,000 years ago", correct: false,
        feedback: "This is closer to when Homo sapiens first evolved in Africa, not when they dispersed out of it. Origin and dispersal are two different points in time." },
      { text: "About 10,000 years ago", correct: false,
        feedback: "Too recent. This falls after the main dispersal and into the period of early agriculture." }
    ]
  },
  {
    concept: "Timeline",
    text: "Which hominin species left Africa around one million years ago, well before the main Out of Africa dispersal event?",
    options: [
      { text: "Homo erectus", correct: true,
        feedback: "Correct. Homo erectus dispersed into Europe and Asia around one million years ago, long before modern Homo sapiens made a second dispersal." },
      { text: "Homo heidelbergensis", correct: false,
        feedback: "Homo heidelbergensis is considered the common ancestor of later African Homo sapiens, Neanderthals and Denisovans, but it is not the species associated with the one-million-year-ago dispersal." },
      { text: "Homo neanderthalensis", correct: false,
        feedback: "Neanderthals evolved later in Europe from a population descended from Homo heidelbergensis. They did not disperse out of Africa themselves." },
      { text: "Homo sapiens", correct: false,
        feedback: "Homo sapiens is the species in the main, more recent dispersal event (60,000 to 70,000 years ago), not the earlier one." }
    ]
  },
  {
    concept: "Genetic evidence: mtDNA",
    text: "Why is mitochondrial DNA (mtDNA) useful evidence for tracing human origins?",
    options: [
      { text: "It is inherited from both parents and recombines each generation, giving a detailed family tree.", correct: false,
        feedback: "This is backwards. mtDNA is inherited only from the mother and does not recombine, which is exactly what makes it useful for tracing a single maternal line." },
      { text: "It is inherited only from the mother and does not recombine, so mutations build up along a single line that can be traced back to a common ancestor.", correct: true,
        feedback: "Correct. Because mtDNA passes down unchanged except for mutations, comparing mtDNA across populations lets scientists trace maternal ancestry back to a shared African origin." },
      { text: "It is found only in Y chromosomes and traces paternal ancestry.", correct: false,
        feedback: "This describes the Y chromosome, not mtDNA. mtDNA traces maternal, not paternal, ancestry." },
      { text: "It mutates too quickly to be useful for tracing ancestry over long timescales.", correct: false,
        feedback: "Its mutation rate is actually what makes it useful. Because mutations accumulate steadily, they act like a molecular clock." }
    ]
  },
  {
    concept: "Genetic evidence: diversity gradient",
    text: "What pattern in modern human genetic diversity supports an African origin?",
    options: [
      { text: "Genetic diversity is roughly equal across all continents.", correct: false,
        feedback: "If this were true it would not support a single origin point. The actual pattern shows a gradient, not equal diversity." },
      { text: "Genetic diversity is highest in African populations and decreases with distance from Africa.", correct: true,
        feedback: "Correct. This gradient is explained by founder effects: each time a smaller group split off to colonise new territory, it carried only a fraction of the genetic variation, so diversity drops the further a population is from the African origin." },
      { text: "Genetic diversity is highest in populations furthest from Africa.", correct: false,
        feedback: "This is the reverse of the actual pattern. Diversity decreases, not increases, with distance from Africa." },
      { text: "Genetic diversity cannot be compared between populations.", correct: false,
        feedback: "It can be and has been compared extensively. This comparison is one of the strongest genetic evidence sources for the hypothesis." }
    ]
  },
  {
    concept: "Common ancestor",
    text: "According to the Out of Africa model, which species is considered the common ancestor of African Homo sapiens, Neanderthals, and Denisovans?",
    options: [
      { text: "Homo erectus", correct: false,
        feedback: "Homo erectus is an earlier and more distant ancestor. The more immediate common ancestor of sapiens, Neanderthals and Denisovans is a later species." },
      { text: "Homo heidelbergensis", correct: true,
        feedback: "Correct. Populations of Homo heidelbergensis in Africa gave rise to Homo sapiens, while populations that had spread into Europe and Asia gave rise to Neanderthals and Denisovans respectively." },
      { text: "Homo neanderthalensis", correct: false,
        feedback: "Neanderthals are a descendant lineage in this model, not the shared ancestor of all three groups." },
      { text: "Homo sapiens", correct: false,
        feedback: "Homo sapiens is one of the descendant lineages in this model, not the ancestor it descended from." }
    ]
  },
  {
    concept: "Genetic evidence: interbreeding",
    text: "What does the presence of small percentages of Neanderthal and Denisovan DNA in some modern human populations indicate?",
    options: [
      { text: "The Out of Africa model must be entirely wrong, since it assumes total replacement.", correct: false,
        feedback: "The model is not disproven by this evidence. Out of Africa is best described as involving limited interbreeding alongside mostly replacing archaic populations, not a strict, absolute replacement with zero gene flow." },
      { text: "There was limited interbreeding between dispersing Homo sapiens and archaic populations such as Neanderthals and Denisovans.", correct: true,
        feedback: "Correct. Modern non-African populations carry small percentages of archaic DNA, showing that some interbreeding occurred during dispersal even though replacement was the dominant pattern." },
      { text: "Modern humans and Neanderthals never had any genetic contact.", correct: false,
        feedback: "This contradicts the evidence itself. The presence of archaic DNA in modern genomes is direct evidence that contact did occur." },
      { text: "Neanderthal and Denisovan DNA make up roughly half of the genome in most non-African populations.", correct: false,
        feedback: "The actual proportion is small, typically a low single-digit percentage, not anywhere close to half the genome." }
    ]
  },
  {
    concept: "Terminology: founder effect",
    text: "What term describes the loss of genetic diversity that occurs when a small subgroup splits off to colonise a new area?",
    options: [
      { text: "Gene flow", correct: false,
        feedback: "Gene flow refers to alleles moving between populations through migration and interbreeding. It does not specifically describe the diversity loss from a small colonising group." },
      { text: "Founder effect", correct: true,
        feedback: "Correct. When a small group splits off to found a new population, it carries only a fraction of the original population's genetic variation, reducing diversity in the new population." },
      { text: "Natural selection", correct: false,
        feedback: "Natural selection describes differential survival and reproduction based on traits. It is not the mechanism behind this particular loss of diversity." },
      { text: "Reproductive isolation", correct: false,
        feedback: "Reproductive isolation refers to barriers that prevent interbreeding between populations. It is a different concept from the diversity loss described here." }
    ]
  },
  {
    concept: "Terminology: reproductive isolation",
    text: "What is meant by reproductive isolation in the context of hominin dispersal?",
    options: [
      { text: "The movement of a population into a new, empty geographic area.", correct: false,
        feedback: "This describes dispersal or colonisation, not reproductive isolation." },
      { text: "The inability of populations to interbreed successfully due to geographic, behavioural, or genetic barriers.", correct: true,
        feedback: "Correct. Reproductive isolation is what allows separated populations to diverge genetically over time, since barriers prevent gene flow between them." },
      { text: "The loss of genetic diversity in a small founding population.", correct: false,
        feedback: "This describes the founder effect, not reproductive isolation. They are related but distinct concepts." },
      { text: "The process by which two separate species interbreed to form a hybrid population.", correct: false,
        feedback: "This is close to the opposite of reproductive isolation, which is specifically about barriers that prevent successful interbreeding." }
    ]
  },
  {
    concept: "Evidence types",
    text: "Which type of evidence most directly supports the timing and direction of the Out of Africa dispersal through the analysis of accumulated DNA mutations?",
    options: [
      { text: "The fossil record alone", correct: false,
        feedback: "Fossils provide valuable evidence of anatomy, timing, and location, but tracking mutation accumulation is a molecular, not fossil, method." },
      { text: "Genetic and molecular evidence, such as mtDNA and Y-chromosome haplogroup analysis", correct: true,
        feedback: "Correct. Comparing mutation patterns in mtDNA and the Y chromosome across populations lets scientists trace ancestry, timing, and direction of dispersal using a molecular clock." },
      { text: "Archaeological artefacts such as tools and cave art", correct: false,
        feedback: "Archaeological evidence supports cultural and behavioural change, but it does not track accumulated DNA mutations." },
      { text: "Radiocarbon dating of geological rock layers", correct: false,
        feedback: "Radiocarbon dating is used on organic material to establish age, but it does not analyse accumulated DNA mutations across populations." }
    ]
  }
];

let selectedAnswers = new Array(questions.length).fill(null);
const container = document.getElementById('quiz-container');
const submitBtn = document.getElementById('submit-btn');
const progressFill = document.getElementById('progress-fill');
const errorMsg = document.getElementById('error-msg');

function render() {
  container.innerHTML = '';
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${questions.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="options" data-qindex="${qi}"></div>
      <div class="feedback" id="feedback-${qi}"></div>
    `;
    container.appendChild(card);
    const optionsDiv = card.querySelector('.options');
    q.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt.text;
      btn.dataset.oindex = oi;
      btn.addEventListener('click', () => selectAnswer(qi, oi));
      optionsDiv.appendChild(btn);
    });
  });
}

function selectAnswer(qi, oi) {
  selectedAnswers[qi] = oi;
  const card = container.children[qi];
  const optionBtns = card.querySelectorAll('.option');
  optionBtns.forEach((btn, i) => {
    btn.classList.remove('selected-correct', 'selected-wrong');
    if (i === oi) {
      btn.classList.add(questions[qi].options[oi].correct ? 'selected-correct' : 'selected-wrong');
    }
  });
  const feedbackDiv = document.getElementById(`feedback-${qi}`);
  const opt = questions[qi].options[oi];
  feedbackDiv.className = 'feedback show ' + (opt.correct ? 'correct' : 'wrong');
  feedbackDiv.innerHTML = `${opt.feedback}<div class="concept-tag">${questions[qi].concept}</div>`;
  updateProgress();
}

function updateProgress() {
  const answeredCount = selectedAnswers.filter(a => a !== null).length;
  progressFill.style.width = (answeredCount / questions.length * 100) + '%';
  if (answeredCount === questions.length) {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit and see my results';
    errorMsg.style.display = 'none';
  } else {
    submitBtn.disabled = false;
    submitBtn.textContent = `Answer all questions (${answeredCount}/${questions.length} done)`;
  }
}

submitBtn.addEventListener('click', () => {
  const answeredCount = selectedAnswers.filter(a => a !== null).length;
  if (answeredCount < questions.length) {
    errorMsg.style.display = 'block';
    return;
  }
  errorMsg.style.display = 'none';
  showResults();
});

function showResults() {
  let score = 0;
  const conceptMistakes = {};

  questions.forEach((q, qi) => {
    const chosen = q.options[selectedAnswers[qi]];
    if (chosen.correct) {
      score++;
    } else {
      if (!conceptMistakes[q.concept]) conceptMistakes[q.concept] = [];
      conceptMistakes[q.concept].push(qi + 1);
    }
    const card = container.children[qi];
    const optionBtns = card.querySelectorAll('.option');
    optionBtns.forEach((btn, oi) => {
      btn.disabled = true;
      if (q.options[oi].correct) btn.classList.add('reveal-correct');
    });
  });

  document.getElementById('score-line').textContent = `${score} / ${questions.length}`;
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('score-sub').textContent = pct >= 80
    ? 'Strong understanding of the Out of Africa hypothesis.'
    : pct >= 50
    ? 'Solid start. A few areas need another look.'
    : 'Worth reviewing the Out of Africa Knowledge and Understanding page before trying again.';

  const weakDiv = document.getElementById('weak-areas');
  const conceptCount = Object.keys(conceptMistakes).length;
  if (conceptCount === 0) {
    weakDiv.innerHTML = '<h3>Areas to revisit</h3><p class="all-good">No mistakes. Every concept area was answered correctly.</p>';
  } else {
    let listHtml = '<h3>Areas to revisit</h3><ul>';
    for (const [concept, qNums] of Object.entries(conceptMistakes)) {
      listHtml += `<li><strong>${concept}</strong>: missed question${qNums.length > 1 ? 's' : ''} ${qNums.join(', ')}. Review this section on the Knowledge and Understanding page before retrying.</li>`;
    }
    listHtml += '</ul>';
    weakDiv.innerHTML = listHtml;
  }

  document.getElementById('results').classList.add('show');
  submitBtn.style.display = 'none';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('retry-btn').addEventListener('click', () => {
  selectedAnswers = new Array(questions.length).fill(null);
  document.getElementById('results').classList.remove('show');
  submitBtn.style.display = 'block';
  progressFill.style.width = '0%';
  render();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
