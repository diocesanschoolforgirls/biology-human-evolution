<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out of Africa Hypothesis Quiz</title>
<style>
  :root {
    /* Human Evolution: bright violet, pink and amber */
    --page: #F5F3FF;          /* lavender page background */
    --deep-forest: #FAF8FF;   /* feedback and concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #EDE9FE;     /* letter circles, dividers */
    --sea-mint: #7C3AED;      /* violet accent */
    --bright: #EC4899;        /* pink */
    --rust: #5B21B6;          /* deep violet text accent */
    --ivory-mint: #1E1B4B;    /* body text */
    --sage-mist: #5B5675;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on violet fills */
    --soft-moss: #5B21B6;     /* button hover */
    --heading: #1E1B4B;       /* headings */
    --good: #15803D;          /* correct */
    --good-tint: #DCFCE7;
    --rose: #DC2626;          /* incorrect */
    --rose-tint: #FEE2E2;
    --mint-tint: #DCFCE7;
    --option-bg: #FAF8FF;
    --track: #DDD6FE;
    --amber: #B45309;         /* principle heading */
    --amber-bar: #F59E0B;
    --amber-tint: #FFFBEB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
  .fb-box.principle { border-left-color: var(--amber-bar); background: var(--amber-tint); }
  .fb-box.principle .fb-head { color: var(--amber) !important; }
  .motif span:nth-child(1) { background: var(--amber-bar); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91606 · Trends in Human Evolution</div>
    <div class="title-row">
      <h1>Out of Africa Hypothesis</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle"><span id="qCount">Ten</span> questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "The hypothesis",
    "q": "Which statement best describes the Out of Africa Hypothesis?",
    "options": [
      "Modern humans evolved in Africa, then dispersed and replaced archaic humans elsewhere with no interbreeding at all",
      "Modern humans evolved in Africa, then dispersed and largely replaced archaic humans elsewhere, with limited interbreeding",
      "Modern humans evolved separately in several regions from local archaic populations, linked by gene flow"
    ],
    "answer": 1,
    "why": [
      "This was the original strict version, so it is partly right. However, Neanderthal and Denisovan DNA in living people shows some interbreeding did occur, so 'no interbreeding at all' is now known to be wrong.",
      "The hypothesis proposes that modern Homo sapiens evolved in Africa, then dispersed across the world, largely replacing archaic populations such as Neanderthals. Genetic evidence shows a small amount of interbreeding happened along the way.",
      "Separate regional evolution linked by gene flow is the Multiregional Hypothesis, the main alternative to Out of Africa."
    ],
    "principle": "Scientific hypotheses are refined as new evidence appears: the core idea can survive while details change, as when evidence of interbreeding modified strict replacement. Apply this whenever you describe a hypothesis, by stating its current form and the evidence that shaped it."
  },
  {
    "concept": "The hypothesis",
    "q": "Which statement best describes the key difference between the Out of Africa and Multiregional hypotheses?",
    "options": [
      "Out of Africa: one recent African origin. Multiregional: local evolution in each region",
      "Out of Africa says Homo erectus never left Africa, but Multiregional says that it did leave",
      "Out of Africa relies on fossil evidence only, while Multiregional relies only on DNA evidence"
    ],
    "answer": 0,
    "why": [
      "Out of Africa proposes that modern humans arose once, recently, in Africa, and then spread. Multiregional proposes that archaic populations in Africa, Europe and Asia each evolved into modern humans locally, kept as one species by gene flow between regions.",
      "Both hypotheses agree that Homo erectus left Africa more than a million years ago. They differ over what happened to its descendants.",
      "Both hypotheses are tested using fossils and genetic evidence. The difference is in what they propose, not the type of evidence they use."
    ],
    "principle": "To compare two hypotheses, identify what they agree on and the specific point where they differ, because evidence can only decide between them on that point. Apply this whenever you compare explanations, by naming the shared ground and the key disagreement."
  },
  {
    "concept": "Fossil evidence",
    "q": "Which pattern in the fossil record best supports the Out of Africa Hypothesis?",
    "options": [
      "Homo erectus fossils are found in both Africa and in Asia",
      "Neanderthal fossils are found right across Europe and western Asia",
      "The oldest Homo sapiens fossils are in Africa, and younger ones elsewhere"
    ],
    "answer": 2,
    "why": [
      "Homo erectus fossils show an earlier dispersal, which both hypotheses accept. They do not show where modern humans arose.",
      "Neanderthal fossils show where Neanderthals lived, but they do not show where Homo sapiens first evolved.",
      "The oldest known Homo sapiens fossils, such as those from Jebel Irhoud in Morocco at about 300 000 years old, are in Africa. Homo sapiens fossils outside Africa are younger. This pattern fits an African origin followed by dispersal."
    ],
    "principle": "Where the oldest examples of a species are found indicates where it most likely originated, and younger examples further away indicate the direction it spread. Apply this whenever you use fossils to locate an origin, by comparing the ages of fossils in different regions."
  },
  {
    "concept": "Genetic evidence",
    "q": "Why is mitochondrial DNA (mtDNA) especially useful for tracing human origins?",
    "options": [
      "It is inherited from both parents and recombines, giving a detailed picture of all ancestors",
      "It is inherited only from the father, so it traces the male line back through time",
      "It is inherited only from the mother and does not recombine, so mutations build up along one line"
    ],
    "answer": 2,
    "why": [
      "If mtDNA recombined each generation, one line of ancestry could not be traced through it.",
      "The Y chromosome traces the male line. mtDNA is passed only through the female line.",
      "mtDNA is passed from mother to child without being mixed with the father's DNA, so the only changes are new mutations. Comparing these mutations across populations traces maternal lines back to common ancestors, and their number can estimate how long ago lines split."
    ],
    "principle": "DNA that is passed down unchanged except for mutations acts as a record of ancestry, because shared mutations show shared ancestors and the number of differences reflects time since they split. Apply this whenever a question uses mtDNA or Y-chromosome evidence."
  },
  {
    "concept": "Genetic evidence",
    "q": "Based on the Out of Africa Hypothesis, which population would be expected to have the lowest genetic diversity?",
    "options": [
      "A population living in East Africa",
      "An Indigenous population in South America",
      "A population living in the Middle East"
    ],
    "answer": 1,
    "why": [
      "African populations are expected to have the highest diversity, because humans have lived there longest and the population was never reduced by migration out.",
      "South America was among the last regions reached, at the end of a long series of migrations. Each time a small group moved on, it carried only part of the existing diversity, so populations furthest from Africa are expected to have the lowest diversity.",
      "The Middle East is close to Africa and was reached early in the dispersal, so it is expected to keep more diversity than regions reached much later."
    ],
    "principle": "When a population spreads through a series of small groups each moving on from the last, diversity falls with each step, a serial founder effect. Apply this whenever you predict genetic diversity along a migration route, because diversity should decrease with distance from the origin."
  },
  {
    "concept": "Genetic evidence",
    "q": "In the human mtDNA family tree, the oldest branches are found only in African populations, and all non-African lineages branch from just one African lineage. What does this suggest?",
    "options": [
      "Humans began in Africa, and one group carrying one lineage left it",
      "Modern humans originated outside Africa and later migrated back into Africa",
      "Every region has an equally old human population that evolved separately"
    ],
    "answer": 0,
    "why": [
      "The deepest branches are where the lineage has existed longest, which is Africa. Because all non-African lineages come from one African branch, the people who left Africa were a small group from within the existing African diversity.",
      "If humans had originated outside Africa, the oldest branches would be found outside Africa, not only within it.",
      "If every region had an equally old population, each would have its own deep, ancient branches. Instead, the deepest branches are found only in Africa."
    ],
    "principle": "In a family tree built from DNA, the region with the deepest and most varied branches is most likely the place of origin, and a single branch shared by all other regions marks the group that left. Apply this whenever you interpret a genetic tree, by finding where its deepest branches are."
  },
  {
    "concept": "Genetic evidence",
    "q": "Using a molecular clock, scientists estimate that the main dispersal of modern humans out of Africa happened about 60 000 to 70 000 years ago. Which statement about this date is most correct?",
    "options": [
      "It shows modern humans first evolved about 60 000 to 70 000 years ago",
      "It dates the main dispersal, which happened long after Homo sapiens first evolved in Africa",
      "It cannot be correct, because Homo erectus left Africa more than a million years ago"
    ],
    "answer": 1,
    "why": [
      "Homo sapiens evolved much earlier, about 300 000 years ago. The molecular clock date refers to the dispersal, not the origin.",
      "Homo sapiens evolved in Africa around 300 000 years ago, but the main dispersal that gave rise to all non-African populations happened much later. Origin and dispersal are two different events.",
      "Homo erectus made an earlier, separate dispersal. Both dates can be correct, because they refer to different species and different events."
    ],
    "principle": "When a question gives a date, check exactly which event it refers to, because the origin of a species and its spread are separate events. Apply this whenever you work with dates in human evolution, by matching each date to its specific event and species."
  },
  {
    "concept": "Interbreeding",
    "q": "People of non-African ancestry carry about 2% Neanderthal DNA, while most sub-Saharan African populations carry very little. What does this suggest?",
    "options": [
      "Neanderthals evolved into modern non-African populations",
      "Interbreeding happened after modern humans left Africa and met Neanderthals in Eurasia",
      "Neanderthals lived in Africa and interbred mainly with African populations"
    ],
    "answer": 1,
    "why": [
      "If Neanderthals had evolved into non-Africans, those populations would carry far more than about 2% Neanderthal DNA.",
      "Neanderthals lived in Europe and western Asia. Modern humans who left Africa met them there and interbred to a small extent, passing Neanderthal DNA to their descendants. Populations that stayed in Africa did not meet Neanderthals, so they carry very little.",
      "Neanderthal fossils are found in Europe and western Asia, not Africa, and the African populations are the ones with the least Neanderthal DNA."
    ],
    "principle": "Where a genetic signal is found shows where and when mixing happened, because only populations that met can share DNA. Apply this whenever a question links archaic DNA to particular populations, by asking where those populations would have met."
  },
  {
    "concept": "The hypothesis",
    "q": "Which statement about Homo erectus is most consistent with the Out of Africa Hypothesis?",
    "options": [
      "Homo erectus never left Africa, so only Homo sapiens ever lived outside it",
      "Homo erectus populations in each region evolved into the modern people living there",
      "Homo erectus left Africa early, but its descendants were largely replaced by Homo sapiens"
    ],
    "answer": 2,
    "why": [
      "Homo erectus fossils are found in Asia, including Java and China, so it clearly left Africa.",
      "Regional evolution of local populations into modern humans is the Multiregional Hypothesis, not Out of Africa.",
      "Out of Africa accepts an early Homo erectus dispersal, but proposes that modern humans evolved later in Africa, then spread and largely replaced the archaic populations descended from earlier migrants, with only limited interbreeding."
    ],
    "principle": "To test which hypothesis a statement supports, check it against the specific claim that separates the hypotheses, rather than points they share. Apply this whenever you classify evidence as supporting one explanation or another."
  },
  {
    "concept": "Weighing evidence",
    "q": "Why is the case for the Out of Africa Hypothesis considered strong?",
    "options": [
      "Independent fossil, mtDNA, Y-chromosome and diversity evidence all point to Africa",
      "A single fossil skull from Africa proves that all modern humans came from there",
      "It has never needed to be changed in any way since it was first proposed"
    ],
    "answer": 0,
    "why": [
      "Fossils show the oldest Homo sapiens in Africa. mtDNA and the Y chromosome both trace deepest ancestry to Africa. Genetic diversity falls with distance from Africa. Because these lines of evidence are independent of each other and still agree, the conclusion is strong.",
      "A single fossil can be important, but it cannot prove an origin for all humans. The strength comes from many types of evidence agreeing.",
      "The hypothesis has been modified, for example to include limited interbreeding. Being able to revise a hypothesis in response to evidence is a strength of science, not a weakness."
    ],
    "principle": "A conclusion is strongest when several independent lines of evidence point to the same answer, because each has different weaknesses. Apply this whenever you evaluate how well supported a hypothesis is, by naming each line of evidence and showing how they agree."
  }
];

const TIPS = {
  "The hypothesis": "Describe the Out of Africa Hypothesis in its current form, and compare it with the Multiregional Hypothesis.",
  "Fossil evidence": "Explain how the ages and locations of Homo sapiens fossils support an African origin.",
  "Genetic evidence": "Review mtDNA inheritance, genetic trees, the diversity gradient and molecular clock dates.",
  "Interbreeding": "Explain what Neanderthal and Denisovan DNA in living people shows about where and when interbreeding happened.",
  "Weighing evidence": "Explain why agreement between independent lines of evidence makes the hypothesis strong."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  if (item.principle) html += '<div class="fb-box principle"><div class="fb-head">The underlying principle</div><p>' + item.principle + '</p></div>';
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  const total = QUESTIONS.length;
  if (score === total) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of the Out of Africa Hypothesis. Try explaining each answer aloud without looking."; }
  else if (score >= Math.ceil(total * 0.8)) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= Math.ceil(total * 0.5)) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">' + total + ' / ' + total + '</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of ' + total + '</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

const WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"];
el("qCount").textContent = WORDS[QUESTIONS.length] || QUESTIONS.length;
buildNav();
render();
</script>
</body>
</html>
