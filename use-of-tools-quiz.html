<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use of Tools Quiz</title>
<style>
  :root {
    /* Human Evolution: bright violet, pink and amber */
    --page: #F5F3FF;          /* lavender page background */
    --deep-forest: #FAF8FF;   /* feedback and concept boxes */
    --pine: #FFFFFF;          /* main card */
    --pine-dark: #EDE9FE;     /* letter circles, dividers */
    --sea-mint: #7C3AED;      /* violet accent */
    --bright: #EC4899;        /* pink */
    --rust: #5B21B6;          /* deep violet text accent */
    --ivory-mint: #1E1B4B;    /* body text */
    --sage-mist: #5B5675;     /* secondary text */
    --deep-pine: #FFFFFF;     /* white text on violet fills */
    --soft-moss: #5B21B6;     /* button hover */
    --heading: #1E1B4B;       /* headings */
    --good: #15803D;          /* correct */
    --good-tint: #DCFCE7;
    --rose: #DC2626;          /* incorrect */
    --rose-tint: #FEE2E2;
    --mint-tint: #DCFCE7;
    --option-bg: #FAF8FF;
    --track: #DDD6FE;
    --amber: #B45309;         /* principle heading */
    --amber-bar: #F59E0B;
    --amber-tint: #FFFBEB;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 60px;
    background: var(--page);
    color: var(--ivory-mint);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { margin-bottom: 0; }
  .label {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sea-mint);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: Cambria, "Times New Roman", serif;
    font-size: 36px;
    margin: 4px 0 2px;
    color: var(--heading);
  }
  .motif { display: flex; gap: 5px; align-items: flex-end; }
  .motif span { display: block; width: 9px; border-radius: 5px; background: var(--sea-mint); }
  .motif span:nth-child(1) { height: 18px; opacity: .55; }
  .motif span:nth-child(2) { height: 28px; background: var(--bright); }
  .motif span:nth-child(3) { height: 38px; }
  .subtitle { color: var(--sage-mist); font-style: italic; margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { height: 3px; width: 90px; border-radius: 3px; background: var(--sea-mint); margin: 10px 0 0; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin: 22px 0 18px; }
  .progress-track { flex: 1; height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sea-mint); border-radius: 6px; transition: width .35s ease; }
  .progress-text { font-size: 15px; color: var(--sage-mist); white-space: nowrap; }

  .card {
    background: var(--pine);
    border-radius: 16px;
    padding: 24px 24px 22px;
    border: 1px solid var(--pine-dark);
    box-shadow: 0 2px 6px rgba(15,118,110,.08);
  }
  .chip {
    display: inline-block;
    background: var(--sea-mint);
    color: var(--deep-pine);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .q-num { font-size: 14px; color: var(--sage-mist); margin-left: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .q-text { font-family: Cambria, "Times New Roman", serif; font-size: 22px; font-weight: bold; margin: 4px 0 18px; color: var(--heading); }
  .q-text em { font-weight: bold; }
  .instruct { font-size: 15px; color: var(--sage-mist); font-style: italic; margin: -8px 0 14px; }

  .option {
    display: flex; align-items: flex-start; gap: 14px;
    width: 100%;
    text-align: left;
    background: var(--option-bg);
    color: var(--ivory-mint);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--sea-mint); }
  .option:focus-visible { outline: 3px solid var(--sage-mist); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .letter {
    flex: 0 0 32px; height: 32px;
    border-radius: 50%;
    background: var(--pine-dark);
    color: var(--sea-mint);
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .option.correct { border-color: var(--sea-mint); background: var(--mint-tint); }
  .option.correct .letter { background: var(--sea-mint); color: var(--deep-pine); }
  .option.wrong { border-color: var(--rose); background: var(--rose-tint); }
  .option.wrong .letter { background: var(--rose); color: var(--deep-pine); }
  .option.faded { opacity: .55; }

  .feedback { margin-top: 16px; display: none; }
  .feedback.show { display: block; animation: rise .3s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fb-box {
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--deep-forest);
    border-left: 6px solid var(--sea-mint);
  }
  .fb-box.wrong { border-left-color: var(--rose); }
  .fb-head { font-weight: bold; font-size: 17px; margin-bottom: 4px; }
  .fb-box .fb-head { color: var(--sea-mint); }
  .fb-box.wrong .fb-head { color: var(--rose); }
  .fb-box p { margin: 0; }

  .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn {
    background: var(--sea-mint);
    color: var(--deep-pine);
    border: none;
    border-radius: 24px;
    padding: 11px 26px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  .btn:hover { background: var(--soft-moss); }
  .btn:focus-visible { outline: 3px solid var(--ivory-mint); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--sea-mint); border: 2px solid var(--sea-mint); }
  .btn.ghost:hover { background: var(--pine-dark); }
  .hidden { display: none !important; }

  /* Results */
  .score-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--deep-forest);
    border: 6px solid var(--sea-mint);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .score-big { color: var(--heading); font-family: Cambria, "Times New Roman", serif; font-size: 38px; font-weight: bold; line-height: 1; }
  .score-small { font-size: 14px; color: var(--sage-mist); }
  .score-msg { flex: 1; min-width: 220px; }
  .score-msg h2 { font-family: Cambria, "Times New Roman", serif; margin: 0 0 6px; font-size: 26px; color: var(--heading); }
  .score-msg p { margin: 0; color: var(--sage-mist); }
  h3 { font-family: Cambria, "Times New Roman", serif; font-size: 21px; margin: 26px 0 10px; color: var(--sea-mint); }
  .concept {
    background: var(--deep-forest);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 10px;
  }
  .concept-top { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
  .concept-score { color: var(--sea-mint); white-space: nowrap; }
  .concept-score.low { color: var(--rose); }
  .concept p { margin: 6px 0 0; color: var(--sage-mist); font-size: 16px; }
  .review-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--pine-dark);
    font-size: 16px;
  }
  .review-item:last-child { border-bottom: none; }
  .mark {
    flex: 0 0 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: var(--deep-pine);
  }
  .mark.ok { background: var(--sea-mint); }
  .mark.no { background: var(--rose); }
  .review-item span.sub { display: block; color: var(--sage-mist); font-size: 15px; }

  @media (max-width: 520px) {
    body { font-size: 17px; padding: 20px 12px 48px; }
    h1 { font-size: 30px; }
    .q-text { font-size: 20px; }
    .card { padding: 20px 16px; }
  }
  .label, h3 { color: var(--rust) !important; }
  .option.correct { border-color: var(--good); background: var(--good-tint); }
  .option.correct .letter { background: var(--good); color: #FFFFFF; }
  .fb-box { border-left-color: var(--good); }
  .fb-box .fb-head { color: var(--good) !important; }
  .fb-box.wrong .fb-head { color: var(--rose) !important; }
  .mark.ok { background: var(--good); }
  .concept-score { color: var(--good); }
  .letter { color: var(--rust); }
  .fb-box.wrong { border-left-color: var(--rose); }
  .option.wrong .letter { color: #FFFFFF; }

  /* Question navigation */
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 12px; }
  .qnav button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--pine-dark); background: var(--pine);
    color: var(--sage-mist); font: inherit; font-size: 14px; font-weight: bold; line-height: 1;
    cursor: pointer; transition: transform .15s ease, border-color .15s ease;
  }
  .qnav button:hover { border-color: var(--sea-mint); }
  .qnav button:focus-visible { outline: 3px solid var(--bright); outline-offset: 2px; }
  .qnav button.done-ok { background: var(--good-tint); border-color: var(--good); color: var(--good); }
  .qnav button.done-no { background: var(--rose-tint); border-color: var(--rose); color: var(--rose); }
  .qnav button.current { background: var(--sea-mint); border-color: var(--sea-mint); color: #FFFFFF; }
  .qnav button.results-btn { width: auto; padding: 0 14px; border-radius: 16px; margin-left: auto; }
  .qnav button.results-btn:disabled { opacity: .45; cursor: default; }
  .qnav button.results-btn:disabled:hover { border-color: var(--pine-dark); }
  @media (max-width: 520px) {
    .qnav { gap: 5px; }
    .qnav button { width: 28px; height: 28px; font-size: 13px; }
    .qnav button.results-btn { margin-left: 0; height: 28px; }
  }
  .review-hint { margin: -4px 0 8px; font-size: 15px; color: var(--sage-mist); font-style: italic; }
  .fb-box.principle { border-left-color: var(--amber-bar); background: var(--amber-tint); }
  .fb-box.principle .fb-head { color: var(--amber) !important; }
  .motif span:nth-child(1) { background: var(--amber-bar); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">AS91606 · Trends in Human Evolution</div>
    <div class="title-row">
      <h1>Use of Tools</h1>
      <div class="motif" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <p class="subtitle">Ten questions. Choose the most correct answer.</p>
    <div class="divider"></div>
  </header>

  <nav class="qnav" id="qnav" aria-label="Choose a question"></nav>

  <main id="quiz" class="card" aria-live="polite">
    <div><span class="chip" id="chip"></span><span class="q-num" id="qNum"></span></div>
    <div class="q-text" id="qText"></div>
    <div class="instruct">Select the most correct answer.</div>
    <div id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn">Next question</button></div>
  </main>

  <section id="results" class="card hidden" aria-live="polite"></section>
</div>

<script>
const QUESTIONS = [
  {
    "concept": "Tool cultures",
    "q": "Which description best fits Oldowan tools, the earliest widespread stone tool culture (from about 2.6 million years ago)?",
    "options": [
      "Simple sharp flakes and choppers, made by striking a stone core with a hammerstone",
      "Symmetrical, teardrop-shaped hand axes, carefully shaped on both sides",
      "Long, thin blades and bone needles used to sew clothing"
    ],
    "answer": 0,
    "why": [
      "Oldowan tools were made by striking one stone (the core) with another (the hammerstone), knocking off sharp flakes. The flakes were used for cutting, and the cores as choppers. Little shaping was involved, and the tools are linked with early Homo, such as Homo habilis.",
      "Symmetrical hand axes describe the later Acheulean culture, linked with Homo erectus.",
      "Blades and bone needles belong to the Upper Palaeolithic, made by Homo sapiens much later."
    ],
    "principle": "Each tool culture is identified by a combination of its technique, typical tool forms and age. Apply this whenever you meet an unfamiliar set of tools, by asking how they were made, what shapes are present and how old they are."
  },
  {
    "concept": "Tool cultures",
    "q": "Acheulean hand axes are shaped on both sides into a symmetrical teardrop form. What does this suggest about the hominins who made them?",
    "options": [
      "They struck stones at random and kept whatever shapes happened to form",
      "They had a planned shape in mind and worked the stone towards it",
      "They could only make tools by copying shapes found in nature"
    ],
    "answer": 1,
    "why": [
      "Random striking produces irregular flakes, like many Oldowan tools. Consistent symmetry in both faces could not happen by chance.",
      "To produce the same symmetrical shape again and again, the maker needed a mental template of the finished tool and had to plan a sequence of strikes to reach it. This suggests greater planning ability than earlier toolmakers.",
      "There is no evidence the shape was copied from a natural object, and the same design was made consistently across Africa, Europe and Asia."
    ],
    "principle": "Artefacts are evidence of the thinking behind them: the more standardised and planned a tool is, the more planning, memory and learning its makers needed. Apply this whenever you are asked what tools tell us about their makers' cognitive abilities."
  },
  {
    "concept": "Tool cultures",
    "q": "Which list puts these tool cultures in order, from oldest to most recent?",
    "options": [
      "Acheulean, Oldowan, Mousterian, Upper Palaeolithic",
      "Oldowan, Mousterian, Acheulean, Upper Palaeolithic",
      "Oldowan, Acheulean, Mousterian, Upper Palaeolithic"
    ],
    "answer": 2,
    "why": [
      "Oldowan tools, from about 2.6 million years ago, are older than Acheulean tools, from about 1.76 million years ago.",
      "Acheulean tools came before Mousterian tools, which date from about 300 000 years ago.",
      "Oldowan tools appear about 2.6 million years ago, Acheulean about 1.76 million years ago, Mousterian about 300 000 years ago, and Upper Palaeolithic about 50 000 years ago."
    ],
    "principle": "Arranging cultures in time order reveals the direction of change, such as increasing complexity and standardisation. Apply this whenever you describe a trend: put the evidence in time order first, then describe what changes from one stage to the next."
  },
  {
    "concept": "Techniques",
    "q": "Neanderthals used the Levallois technique, shaping a stone core first so that a flake of a planned shape could be struck off in one blow. What does this technique show?",
    "options": [
      "The ability to plan several steps ahead before producing the final tool",
      "That Neanderthals could only make one type of tool",
      "That tools were made by striking stones together without any preparation"
    ],
    "answer": 0,
    "why": [
      "In the Levallois technique, the toolmaker prepares the core over many strikes before removing the final flake. The flake's shape is decided before it is struck, which requires planning several steps ahead.",
      "Levallois flakes could be made into a variety of tools, such as scrapers and points, so they did not limit Neanderthals to one type.",
      "Striking without preparation describes Oldowan toolmaking. The Levallois technique depends on careful preparation of the core."
    ],
    "principle": "The more steps a technique involves before the useful product appears, the more forward planning it requires. Apply this whenever you compare techniques, by counting the steps between the raw material and the finished tool."
  },
  {
    "concept": "Trends",
    "q": "Over time, toolmakers produced far more cutting edge from each kilogram of stone. Which statement best explains why this trend matters?",
    "options": [
      "It shows good stone became easier to find, so it was used more freely",
      "It shows that stone tools became larger and heavier over time",
      "It shows more efficient use of stone, so less had to be carried"
    ],
    "answer": 2,
    "why": [
      "Stone did not become easier to find. The trend is about getting more from the same amount of stone.",
      "Tools generally became smaller and finer over time, not larger.",
      "Producing more cutting edge from each kilogram means the same amount of stone made more tools. Toolmakers needed less raw material, which is an advantage when good stone is scarce or has to be carried long distances."
    ],
    "principle": "Improvements in technology often show up as greater efficiency: more useful output for the same input of raw material, energy or time. Apply this whenever you describe a technological trend, by identifying what was gained for the same cost."
  },
  {
    "concept": "Identifying tools",
    "q": "A site contains long, thin, standardised stone blades, bone needles with eyes, and small stone points designed to be fixed onto wooden spear shafts. Which tool culture is this most likely to be?",
    "options": [
      "Oldowan",
      "Upper Palaeolithic",
      "Acheulean"
    ],
    "answer": 1,
    "why": [
      "Oldowan tools are simple flakes and choppers, with no blades, needles or tools made from several parts.",
      "Standardised blades, bone needles and composite tools made from several parts are all typical of the Upper Palaeolithic, made by Homo sapiens from about 50 000 years ago.",
      "Acheulean tools are mainly large, hand-held hand axes. They did not include bone needles or composite spears."
    ],
    "principle": "Later tool cultures are marked by new materials (bone, antler), tools made from several parts, and highly standardised forms. Apply this whenever you place a set of tools in time, by looking for these features of later technology."
  },
  {
    "concept": "Explaining tool use",
    "q": "Why would natural selection have favoured hominins who made and used stone tools?",
    "options": [
      "Tools were mainly used as decoration, to help attract a mate",
      "Tools allowed hominins to avoid doing any hard physical work at all",
      "Tools gave access to energy-rich meat and marrow, and softer food"
    ],
    "answer": 2,
    "why": [
      "Early stone tools show wear from cutting and pounding, and are found with butchered bones, which shows they were used for food.",
      "Toolmaking and tool use were hard physical work. The advantage was the food and resources they gave access to.",
      "Sharp flakes allowed hominins to cut meat from carcasses, and hammerstones cracked bones to reach the marrow. This energy-rich food could support a larger, energy-demanding brain, while cutting and pounding food reduced the need for large teeth and jaws."
    ],
    "principle": "A behaviour is favoured by natural selection when it increases survival and reproduction, often by improving access to food or energy. Apply this whenever you explain why a behaviour evolved, by tracing how it led to more energy, better survival or more offspring."
  },
  {
    "concept": "Cultural evolution",
    "q": "Which statement best describes how the spread of a new toolmaking technique differs from biological evolution?",
    "options": [
      "A new technique can only spread when a mutation for it is passed on",
      "A new technique spreads by learning and teaching, so it can change within one generation",
      "A new technique spreads at the same slow rate as changes in skeleton shape"
    ],
    "answer": 1,
    "why": [
      "There is no gene for a particular toolmaking technique. Techniques are passed on by watching and teaching, not by inheritance.",
      "Cultural evolution spreads through learning, imitation and teaching, so a useful new technique can spread through a group within a single generation. Biological evolution depends on changes in allele frequencies, which take many generations.",
      "Cultural change can be far faster than biological change, because it does not need to wait for alleles to become more common over generations."
    ],
    "principle": "Cultural evolution is passed on by learning and can change within a lifetime, while biological evolution is passed on in genes and changes over generations. Apply this whenever you compare a cultural trait with a physical one, by asking how each is passed on and how quickly each can change."
  },
  {
    "concept": "Trends",
    "q": "Oldowan tools changed very little over about a million years, while Upper Palaeolithic tools changed rapidly. Which conclusion is most correct?",
    "options": [
      "Early hominins were unable to make or use stone tools of any kind",
      "Oldowan tools changed quickly too, but the evidence of it has been lost",
      "Cultural change sped up, linked to more innovation and communication"
    ],
    "answer": 2,
    "why": [
      "Early hominins clearly made tools, because Oldowan tools are found across Africa over a long period.",
      "There is a large, well-dated record of Oldowan tools showing little change, so there is no reason to think quicker change has been lost.",
      "Very slow change suggests limited innovation and limited sharing of new ideas. Rapid change in the Upper Palaeolithic suggests better ability to invent, learn and teach, likely helped by language and larger, more connected populations."
    ],
    "principle": "The rate of change is itself evidence: slow change suggests few new ideas or little sharing, while rapid change suggests frequent innovation spread by learning. Apply this whenever you compare periods, by describing how fast things changed as well as what changed."
  },
  {
    "concept": "Explaining tool use",
    "q": "Which statement best describes the relationship between tool use, diet and brain size?",
    "options": [
      "Tools improved diet, supporting larger brains, which in turn allowed better tools",
      "Brain size increased first, and only then did hominins begin to use tools",
      "Tool use, diet and brain size changed independently, with no link"
    ],
    "answer": 0,
    "why": [
      "Tools gave access to meat, marrow and processed food, which supplied the extra energy a larger brain needs. A larger brain allowed more complex tools and skills, which improved the diet further. Each change reinforced the others.",
      "Simple stone tools appear before the large increase in brain size, so tools did not wait for the brain to enlarge first.",
      "The three changes are closely linked, and each made the others more advantageous."
    ],
    "principle": "Some traits evolve together in a positive feedback loop, where an improvement in one makes further improvement in another more advantageous. Apply this whenever two or more traits change together over time, by explaining how each change increased the advantage of the others."
  }
];

const TIPS = {
  "Tool cultures": "Describe the Oldowan, Acheulean, Mousterian and Upper Palaeolithic cultures in order, with their techniques and makers.",
  "Techniques": "Explain how the Levallois technique shows planning several steps ahead.",
  "Trends": "Describe the trends in tools over time: more cutting edge per kilogram, more standardisation and faster change.",
  "Identifying tools": "Practise identifying a tool culture from its materials, forms and techniques.",
  "Explaining tool use": "Link tool use to diet, energy and brain size, including the feedback between them.",
  "Cultural evolution": "Compare cultural evolution (learned, fast) with biological evolution (inherited, slow)."
};

const LETTERS = ["A", "B", "C"];
let current = 0;
let results = [];
let view = "quiz";

const el = id => document.getElementById(id);
const allDone = () => QUESTIONS.every((_, i) => results[i]);

function buildNav() {
  const nav = el("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Question " + (i + 1));
    b.addEventListener("click", () => goTo(i));
    nav.appendChild(b);
  });
  const r = document.createElement("button");
  r.className = "results-btn";
  r.id = "navResults";
  r.textContent = "Results";
  r.addEventListener("click", () => { if (allDone()) showResults(); });
  nav.appendChild(r);
}

function updateNav() {
  const buttons = el("qnav").querySelectorAll("button:not(.results-btn)");
  buttons.forEach((b, i) => {
    b.className = "";
    if (results[i]) b.classList.add(results[i].correct ? "done-ok" : "done-no");
    if (view === "quiz" && i === current) {
      b.classList.add("current");
      b.setAttribute("aria-current", "step");
    } else {
      b.removeAttribute("aria-current");
    }
  });
  const r = el("navResults");
  r.disabled = !allDone();
  r.classList.toggle("current", view === "results");
  r.title = allDone() ? "See your results" : "Answer all ten questions to unlock your results";
}

function goTo(i) {
  current = i;
  view = "quiz";
  el("results").classList.add("hidden");
  el("quiz").classList.remove("hidden");
  render();
}

function render() {
  const item = QUESTIONS[current];
  el("chip").textContent = item.concept;
  el("qNum").textContent = "Question " + (current + 1) + " of " + QUESTIONS.length;
  el("qText").innerHTML = item.q;

  const box = el("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span>' + text + '</span>';
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  const fb = el("feedback");
  fb.className = "feedback";
  fb.innerHTML = "";
  el("nextBtn").classList.add("hidden");

  if (results[current]) showAnswered(results[current].chosen, false);
  updateNav();
}

function choose(i) {
  if (results[current]) return;
  results[current] = { chosen: i, correct: i === QUESTIONS[current].answer };
  showAnswered(i, true);
  updateNav();
}

function showAnswered(i, focusNext) {
  const item = QUESTIONS[current];
  const correct = i === item.answer;
  el("options").querySelectorAll(".option").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.answer) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("faded");
  });

  let html = "";
  if (correct) {
    html += '<div class="fb-box"><div class="fb-head">Correct. ' + LETTERS[i] + ' is the most correct answer.</div><p>' + item.why[i] + '</p></div>';
  } else {
    html += '<div class="fb-box wrong"><div class="fb-head">Not the most correct. Here is why ' + LETTERS[i] + ' falls short.</div><p>' + item.why[i] + '</p></div>';
    html += '<div class="fb-box"><div class="fb-head">Why ' + LETTERS[item.answer] + ' is the most correct answer</div><p>' + item.why[item.answer] + '</p></div>';
  }
  if (item.principle) html += '<div class="fb-box principle"><div class="fb-head">The underlying principle</div><p>' + item.principle + '</p></div>';
  const fb = el("feedback");
  fb.innerHTML = html;
  fb.className = "feedback show";

  const next = el("nextBtn");
  next.textContent = allDone() ? "See my results" : "Next question";
  next.classList.remove("hidden");
  if (focusNext) next.focus({ preventScroll: true });
}

function nextQuestion() {
  if (allDone()) { showResults(); return; }
  for (let step = 1; step <= QUESTIONS.length; step++) {
    const i = (current + step) % QUESTIONS.length;
    if (!results[i]) { goTo(i); el("qnav").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  }
}

function showResults() {
  view = "results";
  const score = results.filter(r => r && r.correct).length;
  el("quiz").classList.add("hidden");

  let heading, msg;
  if (score === 10) { heading = "Ka pai! Full marks."; msg = "You have a secure understanding of hominin tool use. Try explaining each answer aloud without looking."; }
  else if (score >= 8) { heading = "Strong work."; msg = "You understand most of the key ideas. Check the concept areas below to tidy up the last gaps."; }
  else if (score >= 5) { heading = "Good progress."; msg = "The foundations are there. Focus on the concept areas marked below, then try the quiz again."; }
  else { heading = "Keep going."; msg = "Several answers can sound right in this topic. Work through the concept tips below, then have another go."; }

  const concepts = {};
  QUESTIONS.forEach((q, i) => {
    if (!concepts[q.concept]) concepts[q.concept] = { total: 0, right: 0 };
    concepts[q.concept].total++;
    if (results[i] && results[i].correct) concepts[q.concept].right++;
  });

  let conceptHtml = "";
  const weak = Object.keys(concepts).filter(c => concepts[c].right < concepts[c].total);
  if (weak.length === 0) {
    conceptHtml = '<div class="concept"><div class="concept-top"><span>Every concept area secure</span><span class="concept-score">10 / 10</span></div><p>No gaps to review. Well done.</p></div>';
  } else {
    weak.forEach(c => {
      conceptHtml += '<div class="concept"><div class="concept-top"><span>' + c + '</span><span class="concept-score low">' + concepts[c].right + ' / ' + concepts[c].total + '</span></div><p>' + TIPS[c] + '</p></div>';
    });
  }

  let reviewHtml = "";
  QUESTIONS.forEach((q, i) => {
    const r = results[i];
    const ok = r && r.correct;
    const plain = q.q.replace(/<[^>]+>/g, "");
    const detail = ok
      ? "You chose " + LETTERS[r.chosen] + ", correct."
      : "You chose " + LETTERS[r.chosen] + ". The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer] + ".";
    reviewHtml += '<div class="review-item"><span class="mark ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + '</span><div>' + (i + 1) + ". " + plain + '<span class="sub">' + detail + '</span></div></div>';
  });

  const res = el("results");
  res.innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-circle"><div class="score-big">' + score + '</div><div class="score-small">out of 10</div></div>' +
      '<div class="score-msg"><h2>' + heading + '</h2><p>' + msg + '</p></div>' +
    '</div>' +
    '<h3>' + (weak.length ? "Concepts to review" : "Concept check") + '</h3>' + conceptHtml +
    '<h3>Your answers</h3><p class="review-hint">Click any number above to look back at a question.</p><div>' + reviewHtml + '</div>' +
    '<div class="actions"><button class="btn ghost" id="restartBtn">Try again</button></div>';
  res.classList.remove("hidden");
  el("restartBtn").addEventListener("click", restart);
  updateNav();
  el("qnav").scrollIntoView({ behavior: "smooth", block: "start" });
}

function restart() {
  results = [];
  goTo(0);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

el("nextBtn").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.closest(".qnav")) return;
  const n = ["1","2","3","a","b","c"].indexOf(e.key.toLowerCase());
  if (n !== -1 && !results[current]) choose(n % 3);
});

buildNav();
render();
</script>
</body>
</html>
